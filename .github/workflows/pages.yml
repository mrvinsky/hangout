# Çıkma teklifi sayfasını (legacy/) GitHub Pages'e yayınlar.
# Repo ayarı: Settings → Pages → Source = "GitHub Actions"
name: Pages

on:
  push:
    branches: [main]
    paths: [legacy/**, public/models/cat/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # game-glb.html kedi modelini ../public/models/cat altından yüklüyor; sitede kökte cat/ olarak sun
      - name: Build site
        run: |
          mkdir -p _site/cat
          cp -r legacy/. _site/
          cp -r public/models/cat/. _site/cat/
          sed -i 's#\.\./public/models/cat/#cat/#' _site/game-glb.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
