<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hogwarts AR Ghostbusters ⚡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Pure Canvas 3D Augmented Reality Engine -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    /* Kamera Akışı (Video) */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1); /* Ayna modu gerekirse ayarlanır */
    }

    /* Fallback Simüle Edilmiş Oda (Kamera İzni Yoksa) */
    #simulatedRoom {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1329 0%, #08050d 100%);
      z-index: 1;
      display: none;
    }

    /* Ana Oyun Canvas'ı (Hayaletler, Büyü Işınları, Parçacıklar) */
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* UI Arayüz Katmanı */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    /* Üst Bar: Skor, Can, Radar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 10, 25, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .title-area h2 {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      color: #ffd166;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
    }

    .score-badge {
      font-size: 20px;
      font-weight: 800;
      color: #00f5d4;
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.6);
    }

    .ghost-radar {
      font-size: 13px;
      color: #ff758f;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .radar-dot {
      width: 8px;
      height: 8px;
      background: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0055;
      animation: pulseRadar 1s infinite;
    }

    @keyframes pulseRadar {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Nişangah (Crosshair) */
    .crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border: 2px dashed rgba(255, 215, 0, 0.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .crosshair::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd166;
    }

    .crosshair.locked {
      border-color: #ff0055;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Alt Kısım: Asa ve Büyü Butonları */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .selected-spell-label {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffd166;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Büyü Yuvaları (Spell Dock) */
    .spell-dock {
      display: flex;
      gap: 10px;
      background: rgba(10, 6, 18, 0.75);
      backdrop-filter: blur(16px);
      padding: 10px 14px;
      border-radius: 28px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 100vw;
      overflow-x: auto;
    }

    .spell-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .spell-btn .icon {
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .spell-btn .name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Büyü Renkleri & Aktif Durumlar */
    .spell-btn.stupefy {
      border-color: rgba(255, 42, 109, 0.4);
    }
    .spell-btn.stupefy.active, .spell-btn.stupefy:active {
      background: radial-gradient(circle, #ff2a6d, #70002b);
      border-color: #ff2a6d;
      box-shadow: 0 0 20px #ff2a6d;
      transform: scale(1.08);
    }

    .spell-btn.expelliarmus {
      border-color: rgba(255, 123, 0, 0.4);
    }
    .spell-btn.expelliarmus.active, .spell-btn.expelliarmus:active {
      background: radial-gradient(circle, #ff7b00, #8f3400);
      border-color: #ff7b00;
      box-shadow: 0 0 20px #ff7b00;
      transform: scale(1.08);
    }

    .spell-btn.patronum {
      border-color: rgba(0, 245, 212, 0.4);
    }
    .spell-btn.patronum.active, .spell-btn.patronum:active {
      background: radial-gradient(circle, #00f5d4, #005f52);
      border-color: #00f5d4;
      box-shadow: 0 0 25px #00f5d4;
      transform: scale(1.08);
    }

    .spell-btn.lumos {
      border-color: rgba(255, 215, 0, 0.4);
    }
    .spell-btn.lumos.active, .spell-btn.lumos:active {
      background: radial-gradient(circle, #ffd166, #806200);
      border-color: #ffd166;
      box-shadow: 0 0 20px #ffd166;
      transform: scale(1.08);
    }

    .spell-btn.avada {
      border-color: rgba(57, 255, 20, 0.4);
    }
    .spell-btn.avada.active, .spell-btn.avada:active {
      background: radial-gradient(circle, #39ff14, #0b6100);
      border-color: #39ff14;
      box-shadow: 0 0 25px #39ff14;
      transform: scale(1.08);
    }

    .spell-btn.leviosa {
      border-color: rgba(247, 37, 133, 0.4);
    }
    .spell-btn.leviosa.active, .spell-btn.leviosa:active {
      background: radial-gradient(circle, #f72585, #7209b7);
      border-color: #f72585;
      box-shadow: 0 0 25px #f72585;
      transform: scale(1.08);
    }

    /* Kedi Rozeti */
    .cat-badge {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #ffd166;
      background: rgba(247, 37, 133, 0.25);
      border: 1px solid rgba(255, 209, 102, 0.5);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(247, 37, 133, 0.5);
      animation: catGlow 1.5s infinite alternate;
    }

    @keyframes catGlow {
      from { box-shadow: 0 0 10px rgba(247, 37, 133, 0.4); }
      to { box-shadow: 0 0 25px rgba(255, 209, 102, 0.8); }
    }

    /* Ekran Flaş Efektleri (Büyü Atıldığında) */
    #flashOverlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    /* Başlangıç / İzin Modalı */
    #startModal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle, rgba(16, 9, 29, 0.95), #06030b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .modal-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 28px;
      padding: 36px 26px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 209, 102, 0.15);
    }

    .modal-card h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: #ffd166;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 209, 102, 0.5);
    }

    .modal-card p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-start {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 36px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ffd166, #ff7b00);
      color: #0b0714;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 209, 102, 0.9);
    }

    /* Asanın Ekranda Görünümü */
    .wand-hud {
      position: fixed;
      bottom: -40px;
      right: 10%;
      width: 180px;
      height: 260px;
      pointer-events: none;
      z-index: 12;
      transform-origin: bottom center;
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body>

  <!-- Başlangıç / İzin Ekranı -->
  <div id="startModal">
    <div class="modal-card">
      <div style="font-size: 48px; margin-bottom: 12px;">⚡ 👻 🪄</div>
      <h1>Hogwarts AR Ghostbusters</h1>
      <p>
        The room is haunted by dark specters! Point your phone around the living room, switch your spells, and tap to cast your magic.
      </p>
      <button class="btn-start" id="startBtn">Draw Your Wand 🪄</button>
    </div>
  </div>

  <!-- Canlı Kamera Akışı -->
  <video id="cameraVideo" playsinline autoplay muted></video>
  <div id="simulatedRoom"></div>

  <!-- Çizim Canvas'ı (Hayaletler + Işınlar) -->
  <canvas id="gameCanvas"></canvas>



  <!-- Büyü Flaş Katmanı -->
  <div id="flashOverlay"></div>

  <!-- Nişangah -->
  <div class="crosshair" id="crosshair"></div>

  <!-- HUD Arayüzü -->
  <div id="hud">
    <div class="top-bar">
      <div class="title-area">
        <h2>DEFENSE AGAINST THE DARK ARTS</h2>
        <div class="ghost-radar">
          <span class="radar-dot"></span>
          <span id="ghostCountText">Active Specters: 3</span>
        </div>
      </div>
      <div class="score-badge">
        <span id="scoreText">0</span> pts
      </div>
    </div>

    <div class="bottom-bar">
      <div class="cat-badge" id="catBadge">
        <span>🐾 EXPECTO PATRONUM: Lord Boban Active (<span id="catTimer">10.0</span>s) 🛡️</span>
      </div>

      <div class="selected-spell-label" id="spellLabel">EXPECTO PATRONUM 🐾</div>

      <div class="spell-dock">
        <!-- EXPECTO PATRONUM: OZZY / BOBAN ÇAĞIRICI (Öncelikli Büyü) -->
        <button class="spell-btn patronum active" data-spell="patronum" style="min-width: 175px; height: 60px; padding: 0 22px;">
          <span class="icon" style="font-size: 24px;">🐾</span>
          <span class="name" style="font-size: 11px; letter-spacing: 1px;">Expecto Patronum</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- SES SENTEZLEYİCİSİ (Web Audio API ile Büyü ve Hayalet Sesleri) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSpellSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'stupefy') {
        // Keskin Kırmızı Büyü Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.28);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      } else if (type === 'expelliarmus') {
        // Ateş / Yanma Sesi (Incendio)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'patronum') {
        // İlahi & Parlak Patronus Çanı
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc2.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1040, now + 0.6);
        osc2.frequency.setValueAtTime(784, now);
        osc2.frequency.exponentialRampToValueAtTime(1568, now + 0.6);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc2.start(now);
        osc.stop(now + 0.71);
        osc2.stop(now + 0.71);

        // Sevimli Kedi Miyavı (Ozzy / Boban)
        setTimeout(() => {
          if (!audioCtx) return;
          const meowNow = audioCtx.currentTime;
          const meowOsc = audioCtx.createOscillator();
          const meowGain = audioCtx.createGain();
          meowOsc.type = 'triangle';
          meowOsc.frequency.setValueAtTime(560, meowNow);
          meowOsc.frequency.exponentialRampToValueAtTime(760, meowNow + 0.14);
          meowOsc.frequency.exponentialRampToValueAtTime(430, meowNow + 0.52);
          meowGain.gain.setValueAtTime(0.01, meowNow);
          meowGain.gain.linearRampToValueAtTime(0.28, meowNow + 0.08);
          meowGain.gain.exponentialRampToValueAtTime(0.01, meowNow + 0.52);
          meowOsc.connect(meowGain);
          meowGain.connect(audioCtx.destination);
          meowOsc.start(meowNow);
          meowOsc.stop(meowNow + 0.53);
        }, 180);
      } else if (type === 'lumos') {
        // Parlama çınlaması
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.41);
      } else if (type === 'avada') {
        // Ölümcül Yeşil Lanet Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.51);
      } else if (type === 'leviosa') {
        // Wingardium Leviosa: Büyülü yükselme ve kedi miyavı sentezi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.6);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.61);
      }
    }

    function playGhostDeathSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.41);
    }

    // --- KAMERA & GYRO ENTEGRASYONU ---
    const cameraVideo = document.getElementById('cameraVideo');
    const simulatedRoom = document.getElementById('simulatedRoom');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        cameraVideo.srcObject = stream;
        cameraVideo.play();
      } catch (err) {
        console.warn("Camera could not be accessed, using fallback dark chamber:", err);
        simulatedRoom.style.display = 'block';
      }
    }

    // AR Jiroskop / Ekran Döndürme Verileri
    let camYaw = 0;   // Sağa - Sola açı
    let camPitch = 0; // Yukarı - Aşağı açı

    // Telefonun Jiroskop sensörü
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha !== null && e.beta !== null) {
        camYaw = (e.alpha * Math.PI) / 180;
        camPitch = (e.beta * Math.PI) / 180;
      }
    });

    // Bilgisayarda / Dokunmatik ekranda fareyle / sürükleyerek etrafa bakma (Fallback)
    let isDragging = false;
    let startX = 0, startY = 0;
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud') || e.target.closest('#startModal')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      camYaw -= dx * 0.005;
      camPitch += dy * 0.005;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // --- OYUN CANVAS & NESNELER ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const flashOverlay = document.getElementById('flashOverlay');
    const scoreText = document.getElementById('scoreText');
    const ghostCountText = document.getElementById('ghostCountText');
    const crosshair = document.getElementById('crosshair');

    let width, height;
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let selectedSpell = 'patronum';

    // Büyü Tanımları: Kullanıcının isteğiyle sadece Patronus aktif
    const SPELLS = {
      patronum: {
        name: 'Expecto Patronum 🐾 (Lord Boban)',
        color: '#a2d2ff',
        lightColor: 'rgba(162, 210, 255, 0.65)',
        damage: 150,
        speed: 35,
        flash: 'rgba(162, 210, 255, 0.55)'
      }
    };

    // Büyü Seçimi Butonları
    document.querySelectorAll('.spell-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSpell = btn.dataset.spell;
        document.getElementById('spellLabel').textContent = SPELLS[selectedSpell].name;
        if (navigator.vibrate) navigator.vibrate(20);

        // EXPECTO PATRONUM butonuna basıldığı an OZZY/BOBAN'ı doğrudan çağır!
        if (selectedSpell === 'patronum') {
          initAudio();
          playSpellSound('patronum');
          activeCat = new BritishShorthairPatronus();
        }
      });
    });

    // --- HAYALETLER (GHOSTS) ---
    class Ghost {
      constructor() {
        this.reset();
      }

      reset() {
        // 3D Küresel Koordinatlar (Salonda 360 derece etrafımızda konumlanırlar)
        this.theta = Math.random() * Math.PI * 2; // Yatay açı
        this.phi = (Math.random() - 0.5) * 1.2;  // Dikey açı
        this.distance = 400 + Math.random() * 300; // Mesafesi

        this.maxHealth = 100;
        this.health = this.maxHealth;
        this.type = Math.random() > 0.4 ? 'slimer' : (Math.random() > 0.5 ? 'dementor' : 'pumpkin');
        this.floatOffset = Math.random() * 100;
        this.alpha = 0.85;
        this.isDying = false;
        this.deathTimer = 0;
      }

      update() {
        // Yavaşça süzülme hareketi
        this.floatOffset += 0.04;
        this.theta += 0.003; // Salon etrafında yavaşça döner

        if (this.isDying) {
          this.deathTimer++;
          this.alpha = Math.max(0, 1 - this.deathTimer / 25);
          if (this.alpha <= 0) {
            this.reset();
          }
        }
      }

      // Ekrana İzdüşümü (3D -> 2D Ekran Konumu)
      getScreenPosition() {
        // Kamera açısına göre fark hesapla
        let relTheta = this.theta - camYaw;
        while (relTheta > Math.PI) relTheta -= Math.PI * 2;
        while (relTheta < -Math.PI) relTheta += Math.PI * 2;

        let relPhi = this.phi - camPitch;

        // Görüş alanı (FOV) sınırları içinde mi?
        const fov = 1.3;
        if (Math.abs(relTheta) > fov) return null; // Arkada kalıyor

        const screenX = width / 2 + (relTheta / fov) * (width * 0.9);
        const screenY = height / 2 + (relPhi / fov) * (height * 0.9) + Math.sin(this.floatOffset) * 14;
        const scale = Math.max(0.4, 600 / this.distance);

        return { x: screenX, y: screenY, scale: scale };
      }

      draw() {
        const pos = this.getScreenPosition();
        if (!pos) return;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(pos.scale, pos.scale);
        ctx.globalAlpha = this.alpha;

        const pulse = Math.sin(this.floatOffset) * 5;

        if (this.type === 'slimer') {
          // Neon Yeşil Hayalet (Slimer Tarzı)
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#00f5d4';

          ctx.fillStyle = 'rgba(0, 245, 212, 0.4)';
          ctx.beginPath();
          ctx.arc(0, -10 + pulse, 38, Math.PI, 0, false);
          ctx.bezierCurveTo(42, 30, 25, 45, 0, 50 + pulse);
          ctx.bezierCurveTo(-25, 45, -42, 30, -38, -10 + pulse);
          ctx.fill();

          // Gözler
          ctx.fillStyle = '#fff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#fff';
          ctx.beginPath();
          ctx.arc(-14, -8 + pulse, 9, 0, Math.PI * 2);
          ctx.arc(14, -8 + pulse, 9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#06030b';
          ctx.beginPath();
          ctx.arc(-13, -8 + pulse, 4.5, 0, Math.PI * 2);
          ctx.arc(15, -8 + pulse, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // Sinsi Gülümseme
          ctx.strokeStyle = '#06030b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 14 + pulse, 14, 0.2, Math.PI - 0.2);
          ctx.stroke();

        } else if (this.type === 'dementor') {
          // Ruh Emici / Karanlık Hayalet
          ctx.shadowBlur = 45;
          ctx.shadowColor = '#b5179e';

          ctx.fillStyle = 'rgba(114, 9, 183, 0.55)';
          ctx.beginPath();
          ctx.arc(0, -15 + pulse, 42, Math.PI, 0, false);
          ctx.lineTo(38, 55 + pulse);
          ctx.lineTo(15, 40 + pulse);
          ctx.lineTo(0, 60 + pulse);
          ctx.lineTo(-18, 40 + pulse);
          ctx.lineTo(-38, 55 + pulse);
          ctx.closePath();
          ctx.fill();

          // Parlayan Kırmızı Gözler
          ctx.fillStyle = '#ff0055';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ff0055';
          ctx.beginPath();
          ctx.arc(-14, -12 + pulse, 6, 0, Math.PI * 2);
          ctx.arc(14, -12 + pulse, 6, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // Balkabağı Başlı Cadı Hayaleti 🎃
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#ff7b00';

          ctx.fillStyle = 'rgba(255, 123, 0, 0.85)';
          ctx.beginPath();
          ctx.ellipse(0, 0 + pulse, 36, 30, 0, 0, Math.PI * 2);
          ctx.fill();

          // Oyulmuş Ağız ve Gözler
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.moveTo(-16, -6 + pulse);
          ctx.lineTo(-8, -14 + pulse);
          ctx.lineTo(0, -6 + pulse);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, -6 + pulse);
          ctx.lineTo(8, -14 + pulse);
          ctx.lineTo(16, -6 + pulse);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 10 + pulse, 12, 0, Math.PI);
          ctx.fill();
        }

        // Can Barı
        if (this.health < this.maxHealth) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(-35, -55 + pulse, 70, 7);
          ctx.fillStyle = this.health > 40 ? '#00f5d4' : '#ff0055';
          ctx.fillRect(-35, -55 + pulse, (this.health / this.maxHealth) * 70, 7);
        }

        ctx.restore();
      }
    }

    // Hayaletleri Başlat (Salonda 4 adet)
    const ghosts = [new Ghost(), new Ghost(), new Ghost(), new Ghost()];

    // --- BÜYÜ IŞINI & PARÇACIKLAR ---
    const spellBeams = [];
    const particles = [];

    class SpellBeam {
      constructor(targetX, targetY, spellKey) {
        this.startX = width * 0.85;  // Asanın sağ alttaki ucu
        this.startY = height + 10;
        this.targetX = targetX;
        this.targetY = targetY;
        this.currentX = this.startX;
        this.currentY = this.startY;
        this.spell = SPELLS[spellKey];
        this.progress = 0;
        this.isDone = false;
      }

      update() {
        this.progress += 0.08;
        this.currentX = this.startX + (this.targetX - this.startX) * this.progress;
        this.currentY = this.startY + (this.targetY - this.startY) * this.progress;

        // Işın boyu kıvılcım parçacıkları saç
        for (let i = 0; i < 3; i++) {
          particles.push(new Particle(
            this.currentX + (Math.random() - 0.5) * 15,
            this.currentY + (Math.random() - 0.5) * 15,
            this.spell.color
          ));
        }

        if (this.progress >= 1) {
          this.isDone = true;
          this.onHit();
        }
      }

      onHit() {
        // Hedefte büyük sihirli patlama oluştur
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(this.targetX, this.targetY, this.spell.color, true));
        }

        // Hayalet vuruldu mu kontrol et
        ghosts.forEach(ghost => {
          const pos = ghost.getScreenPosition();
          if (!pos || ghost.isDying) return;

          const dist = Math.hypot(this.targetX - pos.x, this.targetY - pos.y);
          if (dist < 75 * pos.scale) {
            ghost.health -= this.spell.damage;
            if (navigator.vibrate) navigator.vibrate(40);

            if (ghost.health <= 0) {
              ghost.isDying = true;
              playGhostDeathSound();
              score += 150;
              scoreText.textContent = score;
            } else {
              score += 25;
              scoreText.textContent = score;
            }
          }
        });
      }

      draw() {
        ctx.save();
        ctx.strokeStyle = this.spell.color;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.spell.color;

        // Zikzaklı / Yıldırım Büyü Hattı
        ctx.beginPath();
        ctx.moveTo(this.startX, this.startY);
        const steps = 6;
        for (let i = 1; i <= steps; i++) {
          const t = (i / steps) * this.progress;
          const x = this.startX + (this.targetX - this.startX) * t + (Math.random() - 0.5) * 12;
          const y = this.startY + (this.targetY - this.startY) * t + (Math.random() - 0.5) * 12;
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Çekirdek Beyaz Işık
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color, isExplosion = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        const speed = isExplosion ? 3 + Math.random() * 6 : 1 + Math.random() * 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.size = 3 + Math.random() * 3.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.035;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- IŞIKLI KEDİ AYAK İZLERİ (LIGHT FOOTPRINTS) ---
    class LightFootprint {
      constructor(x, y, angle = 0) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.alpha = 0.95;
        this.scale = 1;
      }
      update() {
        this.alpha -= 0.012; // ~4 saniye boyunca yerde kalsın
        this.scale += 0.003;
      }
      draw(targetCtx) {
        if (this.alpha <= 0) return;
        targetCtx.save();
        targetCtx.globalAlpha = Math.max(0, this.alpha);
        targetCtx.translate(this.x, this.y);
        targetCtx.rotate(this.angle);
        targetCtx.scale(this.scale, this.scale);

        targetCtx.fillStyle = "#a2d2ff";
        targetCtx.shadowBlur = 16;
        targetCtx.shadowColor = "#00f5d4";

        // Ana pati yastığı
        targetCtx.beginPath();
        targetCtx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // 4 adet sevimli parmak izi
        const toes = [
          { x: -7, y: -7, r: 2.5 },
          { x: -2.5, y: -9.5, r: 2.8 },
          { x: 2.5, y: -9.5, r: 2.8 },
          { x: 7, y: -7, r: 2.5 }
        ];
        toes.forEach(t => {
          targetCtx.beginPath();
          targetCtx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
          targetCtx.fill();
        });
        targetCtx.restore();
      }
    }

    // --- GERÇEK 3D BRITISH SHORTHAIR PATRONUS (LORD BOBAN / OZZY) ---
    const lightTrails = [];
    let activeCat = null;
    const catBadge = document.getElementById("catBadge");
    const catTimer = document.getElementById("catTimer");

    class BritishShorthairPatronus {
      constructor() {
        this.duration = 10000; // 10 saniye kutsal koruma
        this.startTime = Date.now();
        this.isAlive = true;
        this.walkCycle = 0;
        this.blinkTimer = 0;
        this.isBlinking = false;
        this.time = 0;

        // Ekranın Her Yerinde Özgürce Gezinme (Full-Screen Autonomous Roaming)
        this.x = width * 0.5;
        this.y = height * 0.52;
        this.speed = 2.8;
        this.facing = 1;
        this.targetFacing = 1;
        this.stepCounter = 0;
        this.pickNewDestination();

        // Tamamen Işık Parçacıklarından Oluşan Kedi Modeli (Videodaki Ozzy / Lord Boban)
        this.particles = this.generatePatronusParticles();

        catBadge.style.display = "flex";
        ghostCountText.innerHTML = "🛡️ SANCTUARY: Lord Boban Protected You!";
        ghostCountText.style.color = "#a2d2ff";

        // Salondaki tüm aktif hayaletleri anında yok et
        ghosts.forEach(g => {
          g.isDying = true;
          g.alpha = 0;
        });

        // Çağrılma anında ilahi gümüş-mavi yıldız parçacığı patlaması
        for (let i = 0; i < 35; i++) {
          particles.push(new Particle(this.x, this.y, "#a2d2ff", true));
        }
      }

      // Ekranın herhangi bir yerine yeni hedef belirle (Sadece ortada değil!)
      pickNewDestination() {
        const minX = 75;
        const maxX = Math.max(minX + 80, width - 75);
        const minY = 120;
        const maxY = Math.max(minY + 80, height - 160);

        let attempts = 0;
        let nx, ny, d;
        do {
          nx = minX + Math.random() * (maxX - minX);
          ny = minY + Math.random() * (maxY - minY);
          d = Math.hypot(nx - this.x, ny - this.y);
          attempts++;
        } while (d < Math.min(width * 0.35, 220) && attempts < 15);

        this.targetX = nx;
        this.targetY = ny;
        this.targetFacing = (this.targetX >= this.x) ? 1 : -1;
      }

      update() {
        const elapsed = Date.now() - this.startTime;
        const remaining = Math.max(0, (this.duration - elapsed) / 1000);
        catTimer.textContent = remaining.toFixed(1);

        if (remaining <= 0) {
          this.isAlive = false;
          catBadge.style.display = "none";
          ghostCountText.textContent = "Active Specters: 3";
          ghostCountText.style.color = "#ff758f";

          // Kaybolurken parıldayan altın yıldız patlaması
          for (let i = 0; i < 35; i++) {
            particles.push(new Particle(this.x, this.y, "#ffd166", true));
          }
          return;
        }

        this.time += 0.055;
        this.stepCounter++;

        // Hedefe doğru yürü
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 26) {
          this.pickNewDestination();
        } else {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
          this.walkCycle += 0.07;
        }

        // Yöne doğru akıcı dönüş
        this.facing += (this.targetFacing - this.facing) * 0.14;

        // Gerçekçi Göz Kırpma
        this.blinkTimer++;
        if (this.blinkTimer > 130 && Math.random() < 0.06) {
          this.isBlinking = true;
          if (this.blinkTimer > 142) {
            this.isBlinking = false;
            this.blinkTimer = 0;
          }
        }

        // Kedi yürüdükçe arkasında parlayan ayak izleri bırakır
        if (this.stepCounter % 16 === 0) {
          const footOffset = (this.stepCounter % 32 === 0) ? -18 : 18;
          const footX = this.x + (footOffset * this.facing);
          const footY = this.y + 36;
          lightTrails.push(new LightFootprint(footX, footY, (dx >= 0 ? 0.2 : -0.2)));
          for (let p = 0; p < 2; p++) {
            particles.push(new Particle(footX, footY, "#a2d2ff"));
          }
        }

        // Yürürken havaya dökülen yıldız tozu izi
        if (Math.random() < 0.4) {
          particles.push(new Particle(
            this.x + (Math.random() - 0.5) * 45,
            this.y + (Math.random() - 0.5) * 35,
            Math.random() > 0.3 ? "#a2d2ff" : "#e0f2fe"
          ));
        }
      }

      // British Shorthair Kedi Parçacık Anatomisi (Ozzy)
      generatePatronusParticles() {
        const pts = [];

        // 1. Tombul Gövde (Chubby British Shorthair Torso) - ~110 parçacık
        for (let i = 0; i < 110; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random());
          pts.push({
            type: "body",
            lx: Math.cos(a) * 48 * r,
            ly: Math.sin(a) * 32 * r + 8,
            size: 2.2 + Math.random() * 2.2,
            color: (r > 0.7) ? "#7dd3fc" : (Math.random() > 0.5 ? "#bae6fd" : "#e0f2fe"),
            phase: Math.random() * 10
          });
        }

        // 2. Yuvarlak Kafa (Classic Round Skull) - ~75 parçacık
        for (let i = 0; i < 75; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random());
          pts.push({
            type: "head",
            lx: 34 + Math.cos(a) * 28 * r,
            ly: -18 + Math.sin(a) * 28 * r,
            size: 2.2 + Math.random() * 2.2,
            color: (r > 0.65) ? "#a2d2ff" : "#ffffff",
            phase: Math.random() * 10
          });
        }

        // 3. Pofuduk Tombul Yanaklar (Ozzy'nin Meşhur Yanakları!) - 2 x 30 parçacık
        for (let i = 0; i < 30; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * 14;
          pts.push({
            type: "cheek",
            lx: 48 + Math.cos(a) * r,
            ly: -10 + Math.sin(a) * r,
            size: 2.5 + Math.random() * 1.5,
            color: "#93c5fd",
            phase: Math.random() * 10
          });
          pts.push({
            type: "cheek",
            lx: 24 + Math.cos(a) * r,
            ly: -10 + Math.sin(a) * r,
            size: 2.5 + Math.random() * 1.5,
            color: "#93c5fd",
            phase: Math.random() * 10
          });
        }

        // 4. Yuvarlak Uçlu Kulaklar (Round-tipped Ears) - 2 x 18 parçacık
        for (let i = 0; i < 18; i++) {
          const t = Math.random();
          pts.push({
            type: "ear",
            lx: 18 + (Math.random() - 0.5) * 14 * (1 - t),
            ly: -36 - t * 20,
            size: 2.0 + Math.random() * 1.5,
            color: "#60a5fa",
            phase: Math.random() * 10
          });
          pts.push({
            type: "ear",
            lx: 44 + (Math.random() - 0.5) * 14 * (1 - t),
            ly: -36 - t * 20,
            size: 2.0 + Math.random() * 1.5,
            color: "#60a5fa",
            phase: Math.random() * 10
          });
        }

        // 5. Büyüleyici Kehribar/Altın Gözler (Glowing Amber Stars) - 2 x 12 parçacık
        for (let i = 0; i < 12; i++) {
          pts.push({
            type: "eye",
            lx: 28 + (Math.random() - 0.5) * 6,
            ly: -22 + (Math.random() - 0.5) * 6,
            size: 3.5,
            color: "#ffb703",
            phase: Math.random() * 10
          });
          pts.push({
            type: "eye",
            lx: 46 + (Math.random() - 0.5) * 6,
            ly: -22 + (Math.random() - 0.5) * 6,
            size: 3.5,
            color: "#ffb703",
            phase: Math.random() * 10
          });
        }

        // 6. Dört Bacak ve Patiler (4 Animated Legs & Paws)
        const legs = [
          { id: "bl", hipX: -26, hipY: 18, isBack: true, phaseOffset: 0 },
          { id: "br", hipX: 20, hipY: 18, isBack: true, phaseOffset: Math.PI },
          { id: "fl", hipX: -16, hipY: 22, isBack: false, phaseOffset: Math.PI },
          { id: "fr", hipX: 32, hipY: 22, isBack: false, phaseOffset: 0 }
        ];
        legs.forEach(leg => {
          for (let s = 0; s < 10; s++) {
            pts.push({
              type: "leg",
              legId: leg.id,
              hipX: leg.hipX,
              hipY: leg.hipY,
              seg: s / 10,
              len: 26,
              phaseOffset: leg.phaseOffset,
              size: 2.4,
              color: leg.isBack ? "#7dd3fc" : "#bae6fd",
              phase: Math.random() * 10
            });
          }
          // Parlayan Kedi Patisi
          pts.push({
            type: "paw",
            legId: leg.id,
            hipX: leg.hipX,
            hipY: leg.hipY,
            phaseOffset: leg.phaseOffset,
            size: 4.2,
            color: "#00f5d4",
            phase: Math.random() * 10
          });
        });

        // 7. Kalın ve Pofuduk Kuyruk (Thick Plush Tail) - ~32 parçacık
        for (let i = 0; i < 32; i++) {
          pts.push({
            type: "tail",
            t: i / 32,
            size: 2.4 + (1 - i / 32) * 2.5,
            color: "#93c5fd",
            phase: Math.random() * 10
          });
        }

        // 8. Lord Boban Kutsal Altın Halesi (Golden Floating Crown Halo) - ~26 parçacık
        for (let i = 0; i < 26; i++) {
          pts.push({
            type: "halo",
            angle: (i / 26) * Math.PI * 2,
            size: 2.8,
            color: "#ffd166",
            phase: Math.random() * 10
          });
        }

        return pts;
      }

      draw(targetCtx) {
        if (!this.isAlive) return;

        const bob = Math.sin(this.walkCycle * 4) * 5;
        const catX = this.x;
        const catY = this.y + bob;

        targetCtx.save();

        // 1. Odayı Aydınlatan İlahi Patronus Halesi & Parıltısı (Odayı aydınlatır)
        const auraGrad = targetCtx.createRadialGradient(catX, catY, 20, catX, catY, 190);
        auraGrad.addColorStop(0, "rgba(224, 242, 254, 0.65)");
        auraGrad.addColorStop(0.35, "rgba(162, 210, 255, 0.4)");
        auraGrad.addColorStop(0.7, "rgba(56, 189, 248, 0.15)");
        auraGrad.addColorStop(1, "rgba(162, 210, 255, 0)");
        targetCtx.fillStyle = auraGrad;
        targetCtx.beginPath();
        targetCtx.arc(catX, catY, 190, 0, Math.PI * 2);
        targetCtx.fill();

        // 2. Parçacık Pozisyonlarını Hesapla
        const renderedPoints = [];
        const scale = 1.35;
        const tailWag = Math.sin(this.walkCycle * 2.5) * 0.35;
        const haloOrbit = this.time * 1.8;

        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          let lx = 0, ly = 0;

          // Canlı nefes alan ruhani titreşim
          const jitterX = Math.sin(this.time * 6 + p.phase) * 1.8;
          const jitterY = Math.cos(this.time * 5 + p.phase) * 1.8;

          if (p.type === "body" || p.type === "head" || p.type === "cheek" || p.type === "ear") {
            lx = p.lx + jitterX;
            ly = p.ly + jitterY;
          } else if (p.type === "eye") {
            if (this.isBlinking) continue; // Göz kırpma
            lx = p.lx + jitterX * 0.5;
            ly = p.ly + jitterY * 0.5;
          } else if (p.type === "leg") {
            const swing = Math.sin(this.walkCycle * 4 + p.phaseOffset) * 0.4;
            const currentLen = p.seg * p.len;
            lx = p.hipX + Math.sin(swing) * currentLen + jitterX * 0.5;
            ly = p.hipY + Math.cos(swing) * currentLen + jitterY * 0.5;
          } else if (p.type === "paw") {
            const swing = Math.sin(this.walkCycle * 4 + p.phaseOffset) * 0.4;
            lx = p.hipX + Math.sin(swing) * 27 + jitterX * 0.5;
            ly = p.hipY + Math.cos(swing) * 27 + jitterY * 0.5;
          } else if (p.type === "tail") {
            const t = p.t;
            const bx = -45 - t * 45;
            const by = 8 - t * 40 + Math.sin(tailWag + t * 2) * 24;
            lx = bx + jitterX * 0.8;
            ly = by + jitterY * 0.8;
          } else if (p.type === "halo") {
            const a = p.angle + haloOrbit;
            lx = 34 + Math.cos(a) * 26 + jitterX * 0.4;
            ly = -62 + Math.sin(a) * 8 + jitterY * 0.4;
          }

          // Yön ve Ekran Dönüşümü
          const sx = catX + lx * this.facing * scale;
          const sy = catY + ly * scale;
          renderedPoints.push({
            x: sx,
            y: sy,
            size: p.size,
            color: p.color,
            isEye: p.type === "eye",
            isHalo: p.type === "halo"
          });
        }

        // 3. Ethereal Enerji Ağı (Constellation Filaments)
        targetCtx.strokeStyle = "rgba(162, 210, 255, 0.22)";
        targetCtx.lineWidth = 1;
        targetCtx.beginPath();
        const len = renderedPoints.length;
        for (let a = 0; a < len; a += 3) {
          const p1 = renderedPoints[a];
          for (let b = a + 1; b < Math.min(a + 12, len); b++) {
            const p2 = renderedPoints[b];
            const distSq = (p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2;
            if (distSq < 220) {
              targetCtx.moveTo(p1.x, p1.y);
              targetCtx.lineTo(p2.x, p2.y);
            }
          }
        }
        targetCtx.stroke();

        // 4. Parçacıkları Çiz (Glow Dots)
        for (let i = 0; i < len; i++) {
          const pt = renderedPoints[i];
          targetCtx.fillStyle = pt.color;
          targetCtx.shadowBlur = pt.isEye ? 16 : (pt.isHalo ? 12 : 8);
          targetCtx.shadowColor = pt.color;
          targetCtx.beginPath();
          targetCtx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          targetCtx.fill();
        }

        // 5. Lord Boban Kutsal Başlığı 👑
        targetCtx.shadowBlur = 14;
        targetCtx.shadowColor = "#ffd166";
        targetCtx.fillStyle = "#ffd166";
        targetCtx.font = "bold 15px 'Outfit', sans-serif";
        targetCtx.textAlign = "center";
        targetCtx.fillText("👑 LORD BOBAN", catX + 34 * this.facing * scale, catY - 78 * scale);

        targetCtx.restore();
      }
    }

    // --- BÜYÜ YAPMA (Ekrana Dokununca Ateşle) ---
    function castSpell(targetX, targetY) {
      initAudio();
      const spell = SPELLS[selectedSpell];

      // Ekran Flaşı
      flashOverlay.style.background = spell.flash;
      flashOverlay.style.opacity = "1";
      setTimeout(() => { flashOverlay.style.opacity = "0"; }, 100);

      playSpellSound(selectedSpell);
      if (navigator.vibrate) navigator.vibrate(35);

      spellBeams.push(new SpellBeam(targetX, targetY, selectedSpell));

      // EXPECTO PATRONUM atılırsa: Kedi Patronus u (Ozzy / Boban) çağır!
      if (selectedSpell === "patronum") {
        activeCat = new BritishShorthairPatronus();
      }
    }

    // Ekranın ortasına veya dokunulan noktaya büyü at
    canvas.addEventListener("click", (e) => {
      castSpell(e.clientX, e.clientY);
    });

    // Nişangah Takibi (Bir hayalete kilitlendiğinde kırmızıya dönsün)
    function checkCrosshairLock() {
      if (activeCat && activeCat.isAlive) {
        crosshair.classList.remove("locked");
        return;
      }

      let isLocked = false;
      ghosts.forEach(ghost => {
        const pos = ghost.getScreenPosition();
        if (!pos || ghost.isDying) return;
        const dist = Math.hypot(width / 2 - pos.x, height / 2 - pos.y);
        if (dist < 60 * pos.scale) isLocked = true;
      });

      if (isLocked) crosshair.classList.add("locked");
      else crosshair.classList.remove("locked");
    }

    // --- ANA OYUN DÖNGÜSÜ (Game Loop) ---
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // 1. Kedinin Bıraktığı Zemin Işık İzlerini Çiz ve Güncelle
      for (let i = lightTrails.length - 1; i >= 0; i--) {
        const trail = lightTrails[i];
        trail.update();
        trail.draw(ctx);
        if (trail.alpha <= 0) lightTrails.splice(i, 1);
      }

      // 2. Gerçek 3D Ruh Kedisi (Lord Boban - British Shorthair Patronus)
      if (activeCat) {
        activeCat.update();
        if (activeCat.isAlive) {
          activeCat.draw(ctx);
        } else {
          activeCat = null;
        }
      }

      // 3. Kutsal Koruma (Sanctuary): Kedi ekrandayken ASLA hayalet gelmez, var olanlar kaçar!
      if (activeCat && activeCat.isAlive) {
        ghosts.forEach(ghost => {
          ghost.alpha = Math.max(0, ghost.alpha - 0.08);
          if (ghost.alpha > 0) ghost.draw();
        });
      } else {
        // Kedi yokken normal hayaletler oyunda aktif olur
        ghosts.forEach(ghost => {
          ghost.update();
          ghost.draw();
        });
      }

      // Büyü Işınlarını Çiz
      for (let i = spellBeams.length - 1; i >= 0; i--) {
        const beam = spellBeams[i];
        beam.update();
        beam.draw();
        if (beam.isDone) spellBeams.splice(i, 1);
      }

      // Parçacıkları Çiz
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      checkCrosshairLock();
      requestAnimationFrame(gameLoop);
    }

    // Başlat Butonuna Basınca
    document.getElementById("startBtn").addEventListener("click", () => {
      initAudio();
      startCamera();
      document.getElementById("startModal").style.display = "none";
      gameLoop();
    });
  </script>
