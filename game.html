<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hogwarts AR Ghostbusters ⚡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Pure Canvas 3D Augmented Reality Engine -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    /* Kamera Akışı (Video) */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1); /* Ayna modu gerekirse ayarlanır */
    }

    /* Fallback Simüle Edilmiş Oda (Kamera İzni Yoksa) */
    #simulatedRoom {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1329 0%, #08050d 100%);
      z-index: 1;
      display: none;
    }

    /* Ana Oyun Canvas'ı (Hayaletler, Büyü Işınları, Parçacıklar) */
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* UI Arayüz Katmanı */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    /* Üst Bar: Skor, Can, Radar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 10, 25, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .title-area h2 {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      color: #ffd166;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
    }

    .score-badge {
      font-size: 20px;
      font-weight: 800;
      color: #00f5d4;
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.6);
    }

    .ghost-radar {
      font-size: 13px;
      color: #ff758f;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .radar-dot {
      width: 8px;
      height: 8px;
      background: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0055;
      animation: pulseRadar 1s infinite;
    }

    @keyframes pulseRadar {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Nişangah (Crosshair) */
    .crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border: 2px dashed rgba(255, 215, 0, 0.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .crosshair::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd166;
    }

    .crosshair.locked {
      border-color: #ff0055;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Alt Kısım: Asa ve Büyü Butonları */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .selected-spell-label {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffd166;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Büyü Yuvaları (Spell Dock) */
    .spell-dock {
      display: flex;
      gap: 10px;
      background: rgba(10, 6, 18, 0.75);
      backdrop-filter: blur(16px);
      padding: 10px 14px;
      border-radius: 28px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 100vw;
      overflow-x: auto;
    }

    .spell-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .spell-btn .icon {
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .spell-btn .name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Büyü Renkleri & Aktif Durumlar */
    .spell-btn.stupefy {
      border-color: rgba(255, 42, 109, 0.4);
    }
    .spell-btn.stupefy.active, .spell-btn.stupefy:active {
      background: radial-gradient(circle, #ff2a6d, #70002b);
      border-color: #ff2a6d;
      box-shadow: 0 0 20px #ff2a6d;
      transform: scale(1.08);
    }

    .spell-btn.expelliarmus {
      border-color: rgba(255, 123, 0, 0.4);
    }
    .spell-btn.expelliarmus.active, .spell-btn.expelliarmus:active {
      background: radial-gradient(circle, #ff7b00, #8f3400);
      border-color: #ff7b00;
      box-shadow: 0 0 20px #ff7b00;
      transform: scale(1.08);
    }

    .spell-btn.patronum {
      border-color: rgba(0, 245, 212, 0.4);
    }
    .spell-btn.patronum.active, .spell-btn.patronum:active {
      background: radial-gradient(circle, #00f5d4, #005f52);
      border-color: #00f5d4;
      box-shadow: 0 0 25px #00f5d4;
      transform: scale(1.08);
    }

    .spell-btn.lumos {
      border-color: rgba(255, 215, 0, 0.4);
    }
    .spell-btn.lumos.active, .spell-btn.lumos:active {
      background: radial-gradient(circle, #ffd166, #806200);
      border-color: #ffd166;
      box-shadow: 0 0 20px #ffd166;
      transform: scale(1.08);
    }

    .spell-btn.avada {
      border-color: rgba(57, 255, 20, 0.4);
    }
    .spell-btn.avada.active, .spell-btn.avada:active {
      background: radial-gradient(circle, #39ff14, #0b6100);
      border-color: #39ff14;
      box-shadow: 0 0 25px #39ff14;
      transform: scale(1.08);
    }

    .spell-btn.leviosa {
      border-color: rgba(247, 37, 133, 0.4);
    }
    .spell-btn.leviosa.active, .spell-btn.leviosa:active {
      background: radial-gradient(circle, #f72585, #7209b7);
      border-color: #f72585;
      box-shadow: 0 0 25px #f72585;
      transform: scale(1.08);
    }

    /* Kedi Rozeti */
    .cat-badge {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #ffd166;
      background: rgba(247, 37, 133, 0.25);
      border: 1px solid rgba(255, 209, 102, 0.5);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(247, 37, 133, 0.5);
      animation: catGlow 1.5s infinite alternate;
    }

    @keyframes catGlow {
      from { box-shadow: 0 0 10px rgba(247, 37, 133, 0.4); }
      to { box-shadow: 0 0 25px rgba(255, 209, 102, 0.8); }
    }

    /* Ekran Flaş Efektleri (Büyü Atıldığında) */
    #flashOverlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    /* Başlangıç / İzin Modalı */
    #startModal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle, rgba(16, 9, 29, 0.95), #06030b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .modal-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 28px;
      padding: 36px 26px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 209, 102, 0.15);
    }

    .modal-card h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: #ffd166;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 209, 102, 0.5);
    }

    .modal-card p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-start {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 36px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ffd166, #ff7b00);
      color: #0b0714;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 209, 102, 0.9);
    }

    /* Asanın Ekranda Görünümü */
    .wand-hud {
      position: fixed;
      bottom: -40px;
      right: 10%;
      width: 180px;
      height: 260px;
      pointer-events: none;
      z-index: 12;
      transform-origin: bottom center;
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body>

  <!-- Başlangıç / İzin Ekranı -->
  <div id="startModal">
    <div class="modal-card">
      <div style="font-size: 48px; margin-bottom: 12px;">⚡ 👻 🪄</div>
      <h1>Hogwarts AR Ghostbusters</h1>
      <p>
        The room is haunted by dark specters! Point your phone around the living room, switch your spells, and tap to cast your magic.
      </p>
      <button class="btn-start" id="startBtn">Draw Your Wand 🪄</button>
    </div>
  </div>

  <!-- Canlı Kamera Akışı -->
  <video id="cameraVideo" playsinline autoplay muted></video>
  <div id="simulatedRoom"></div>

  <!-- Çizim Canvas'ı (Hayaletler + Işınlar) -->
  <canvas id="gameCanvas"></canvas>



  <!-- Büyü Flaş Katmanı -->
  <div id="flashOverlay"></div>

  <!-- Nişangah -->
  <div class="crosshair" id="crosshair"></div>

  <!-- HUD Arayüzü -->
  <div id="hud">
    <div class="top-bar">
      <div class="title-area">
        <h2>DEFENSE AGAINST THE DARK ARTS</h2>
        <div class="ghost-radar">
          <span class="radar-dot"></span>
          <span id="ghostCountText">Active Specters: 3</span>
        </div>
      </div>
      <div class="score-badge">
        <span id="scoreText">0</span> pts
      </div>
    </div>

    <div class="bottom-bar">
      <div class="cat-badge" id="catBadge">
        <span>🐾 EXPECTO PATRONUM: Lord Boban Active (<span id="catTimer">10.0</span>s) 🛡️</span>
      </div>

      <div class="selected-spell-label" id="spellLabel">STUPEFY ⚡</div>

      <div class="spell-dock">
        <!-- Büyü Butonları -->
        <button class="spell-btn stupefy active" data-spell="stupefy">
          <span class="icon">🔴</span>
          <span class="name">Stupefy</span>
        </button>

        <button class="spell-btn expelliarmus" data-spell="expelliarmus">
          <span class="icon">🔥</span>
          <span class="name">Incendio</span>
        </button>

        <!-- EXPECTO PATRONUM: OZZY / BOBAN ÇAĞIRICI -->
        <button class="spell-btn patronum" data-spell="patronum">
          <span class="icon">🐾</span>
          <span class="name">Patronus</span>
        </button>

        <button class="spell-btn lumos" data-spell="lumos">
          <span class="icon">✨</span>
          <span class="name">Lumos</span>
        </button>

        <button class="spell-btn avada" data-spell="avada">
          <span class="icon">💚</span>
          <span class="name">Avada</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- SES SENTEZLEYİCİSİ (Web Audio API ile Büyü ve Hayalet Sesleri) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSpellSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'stupefy') {
        // Keskin Kırmızı Büyü Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.28);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      } else if (type === 'expelliarmus') {
        // Ateş / Yanma Sesi (Incendio)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'patronum') {
        // İlahi & Parlak Patronus Çanı
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc2.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1040, now + 0.6);
        osc2.frequency.setValueAtTime(784, now);
        osc2.frequency.exponentialRampToValueAtTime(1568, now + 0.6);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc2.start(now);
        osc.stop(now + 0.71);
        osc2.stop(now + 0.71);

        // Sevimli Kedi Miyavı (Ozzy / Boban)
        setTimeout(() => {
          if (!audioCtx) return;
          const meowNow = audioCtx.currentTime;
          const meowOsc = audioCtx.createOscillator();
          const meowGain = audioCtx.createGain();
          meowOsc.type = 'triangle';
          meowOsc.frequency.setValueAtTime(560, meowNow);
          meowOsc.frequency.exponentialRampToValueAtTime(760, meowNow + 0.14);
          meowOsc.frequency.exponentialRampToValueAtTime(430, meowNow + 0.52);
          meowGain.gain.setValueAtTime(0.01, meowNow);
          meowGain.gain.linearRampToValueAtTime(0.28, meowNow + 0.08);
          meowGain.gain.exponentialRampToValueAtTime(0.01, meowNow + 0.52);
          meowOsc.connect(meowGain);
          meowGain.connect(audioCtx.destination);
          meowOsc.start(meowNow);
          meowOsc.stop(meowNow + 0.53);
        }, 180);
      } else if (type === 'lumos') {
        // Parlama çınlaması
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.41);
      } else if (type === 'avada') {
        // Ölümcül Yeşil Lanet Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.51);
      } else if (type === 'leviosa') {
        // Wingardium Leviosa: Büyülü yükselme ve kedi miyavı sentezi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.6);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.61);
      }
    }

    function playGhostDeathSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.41);
    }

    // --- KAMERA & GYRO ENTEGRASYONU ---
    const cameraVideo = document.getElementById('cameraVideo');
    const simulatedRoom = document.getElementById('simulatedRoom');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        cameraVideo.srcObject = stream;
        cameraVideo.play();
      } catch (err) {
        console.warn("Camera could not be accessed, using fallback dark chamber:", err);
        simulatedRoom.style.display = 'block';
      }
    }

    // AR Jiroskop / Ekran Döndürme Verileri
    let camYaw = 0;   // Sağa - Sola açı
    let camPitch = 0; // Yukarı - Aşağı açı

    // Telefonun Jiroskop sensörü
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha !== null && e.beta !== null) {
        camYaw = (e.alpha * Math.PI) / 180;
        camPitch = (e.beta * Math.PI) / 180;
      }
    });

    // Bilgisayarda / Dokunmatik ekranda fareyle / sürükleyerek etrafa bakma (Fallback)
    let isDragging = false;
    let startX = 0, startY = 0;
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud') || e.target.closest('#startModal')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      camYaw -= dx * 0.005;
      camPitch += dy * 0.005;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // --- OYUN CANVAS & NESNELER ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const flashOverlay = document.getElementById('flashOverlay');
    const scoreText = document.getElementById('scoreText');
    const ghostCountText = document.getElementById('ghostCountText');
    const crosshair = document.getElementById('crosshair');

    let width, height;
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let selectedSpell = 'stupefy';

    // Büyü Tanımları
    const SPELLS = {
      stupefy: {
        name: 'Stupefy ⚡',
        color: '#ff2a6d',
        lightColor: 'rgba(255, 42, 109, 0.4)',
        damage: 35,
        speed: 28,
        flash: 'rgba(255, 42, 109, 0.35)'
      },
      expelliarmus: {
        name: 'Incendio 🔥',
        color: '#ff7b00',
        lightColor: 'rgba(255, 123, 0, 0.4)',
        damage: 50,
        speed: 24,
        flash: 'rgba(255, 123, 0, 0.35)'
      },
      patronum: {
        name: 'Expecto Patronum 🐾 (Lord Boban)',
        color: '#a2d2ff',
        lightColor: 'rgba(162, 210, 255, 0.65)',
        damage: 150,
        speed: 35,
        flash: 'rgba(162, 210, 255, 0.55)'
      },
      lumos: {
        name: 'Lumos Maxima ✨',
        color: '#ffd166',
        lightColor: 'rgba(255, 209, 102, 0.5)',
        damage: 20,
        speed: 22,
        flash: 'rgba(255, 209, 102, 0.5)'
      },
      avada: {
        name: 'Avada Kedavra 💚',
        color: '#39ff14',
        lightColor: 'rgba(57, 255, 20, 0.5)',
        damage: 250,
        speed: 40,
        flash: 'rgba(57, 255, 20, 0.5)'
      }
    };

    // Büyü Seçimi Butonları
    document.querySelectorAll('.spell-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('active'));

    // --- HAYALETLER (GHOSTS) ---
    class Ghost {
      constructor() {
        this.reset();
      }

      reset() {
        // 3D Küresel Koordinatlar (Salonda 360 derece etrafımızda konumlanırlar)
        this.theta = Math.random() * Math.PI * 2; // Yatay açı
        this.phi = (Math.random() - 0.5) * 1.2;  // Dikey açı
        this.distance = 400 + Math.random() * 300; // Mesafesi

        this.maxHealth = 100;
        this.health = this.maxHealth;
        this.type = Math.random() > 0.4 ? 'slimer' : (Math.random() > 0.5 ? 'dementor' : 'pumpkin');
        this.floatOffset = Math.random() * 100;
        this.alpha = 0.85;
        this.isDying = false;
        this.deathTimer = 0;
      }

      update() {
        // Yavaşça süzülme hareketi
        this.floatOffset += 0.04;
        this.theta += 0.003; // Salon etrafında yavaşça döner

        if (this.isDying) {
          this.deathTimer++;
          this.alpha = Math.max(0, 1 - this.deathTimer / 25);
          if (this.alpha <= 0) {
            this.reset();
          }
        }
      }

      // Ekrana İzdüşümü (3D -> 2D Ekran Konumu)
      getScreenPosition() {
        // Kamera açısına göre fark hesapla
        let relTheta = this.theta - camYaw;
        while (relTheta > Math.PI) relTheta -= Math.PI * 2;
        while (relTheta < -Math.PI) relTheta += Math.PI * 2;

        let relPhi = this.phi - camPitch;

        // Görüş alanı (FOV) sınırları içinde mi?
        const fov = 1.3;
        if (Math.abs(relTheta) > fov) return null; // Arkada kalıyor

        const screenX = width / 2 + (relTheta / fov) * (width * 0.9);
        const screenY = height / 2 + (relPhi / fov) * (height * 0.9) + Math.sin(this.floatOffset) * 14;
        const scale = Math.max(0.4, 600 / this.distance);

        return { x: screenX, y: screenY, scale: scale };
      }

      draw() {
        const pos = this.getScreenPosition();
        if (!pos) return;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(pos.scale, pos.scale);
        ctx.globalAlpha = this.alpha;

        const pulse = Math.sin(this.floatOffset) * 5;

        if (this.type === 'slimer') {
          // Neon Yeşil Hayalet (Slimer Tarzı)
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#00f5d4';

          ctx.fillStyle = 'rgba(0, 245, 212, 0.4)';
          ctx.beginPath();
          ctx.arc(0, -10 + pulse, 38, Math.PI, 0, false);
          ctx.bezierCurveTo(42, 30, 25, 45, 0, 50 + pulse);
          ctx.bezierCurveTo(-25, 45, -42, 30, -38, -10 + pulse);
          ctx.fill();

          // Gözler
          ctx.fillStyle = '#fff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#fff';
          ctx.beginPath();
          ctx.arc(-14, -8 + pulse, 9, 0, Math.PI * 2);
          ctx.arc(14, -8 + pulse, 9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#06030b';
          ctx.beginPath();
          ctx.arc(-13, -8 + pulse, 4.5, 0, Math.PI * 2);
          ctx.arc(15, -8 + pulse, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // Sinsi Gülümseme
          ctx.strokeStyle = '#06030b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 14 + pulse, 14, 0.2, Math.PI - 0.2);
          ctx.stroke();

        } else if (this.type === 'dementor') {
          // Ruh Emici / Karanlık Hayalet
          ctx.shadowBlur = 45;
          ctx.shadowColor = '#b5179e';

          ctx.fillStyle = 'rgba(114, 9, 183, 0.55)';
          ctx.beginPath();
          ctx.arc(0, -15 + pulse, 42, Math.PI, 0, false);
          ctx.lineTo(38, 55 + pulse);
          ctx.lineTo(15, 40 + pulse);
          ctx.lineTo(0, 60 + pulse);
          ctx.lineTo(-18, 40 + pulse);
          ctx.lineTo(-38, 55 + pulse);
          ctx.closePath();
          ctx.fill();

          // Parlayan Kırmızı Gözler
          ctx.fillStyle = '#ff0055';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ff0055';
          ctx.beginPath();
          ctx.arc(-14, -12 + pulse, 6, 0, Math.PI * 2);
          ctx.arc(14, -12 + pulse, 6, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // Balkabağı Başlı Cadı Hayaleti 🎃
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#ff7b00';

          ctx.fillStyle = 'rgba(255, 123, 0, 0.85)';
          ctx.beginPath();
          ctx.ellipse(0, 0 + pulse, 36, 30, 0, 0, Math.PI * 2);
          ctx.fill();

          // Oyulmuş Ağız ve Gözler
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.moveTo(-16, -6 + pulse);
          ctx.lineTo(-8, -14 + pulse);
          ctx.lineTo(0, -6 + pulse);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, -6 + pulse);
          ctx.lineTo(8, -14 + pulse);
          ctx.lineTo(16, -6 + pulse);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 10 + pulse, 12, 0, Math.PI);
          ctx.fill();
        }

        // Can Barı
        if (this.health < this.maxHealth) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(-35, -55 + pulse, 70, 7);
          ctx.fillStyle = this.health > 40 ? '#00f5d4' : '#ff0055';
          ctx.fillRect(-35, -55 + pulse, (this.health / this.maxHealth) * 70, 7);
        }

        ctx.restore();
      }
    }

    // Hayaletleri Başlat (Salonda 4 adet)
    const ghosts = [new Ghost(), new Ghost(), new Ghost(), new Ghost()];

    // --- BÜYÜ IŞINI & PARÇACIKLAR ---
    const spellBeams = [];
    const particles = [];

    class SpellBeam {
      constructor(targetX, targetY, spellKey) {
        this.startX = width * 0.85;  // Asanın sağ alttaki ucu
        this.startY = height + 10;
        this.targetX = targetX;
        this.targetY = targetY;
        this.currentX = this.startX;
        this.currentY = this.startY;
        this.spell = SPELLS[spellKey];
        this.progress = 0;
        this.isDone = false;
      }

      update() {
        this.progress += 0.08;
        this.currentX = this.startX + (this.targetX - this.startX) * this.progress;
        this.currentY = this.startY + (this.targetY - this.startY) * this.progress;

        // Işın boyu kıvılcım parçacıkları saç
        for (let i = 0; i < 3; i++) {
          particles.push(new Particle(
            this.currentX + (Math.random() - 0.5) * 15,
            this.currentY + (Math.random() - 0.5) * 15,
            this.spell.color
          ));
        }

        if (this.progress >= 1) {
          this.isDone = true;
          this.onHit();
        }
      }

      onHit() {
        // Hedefte büyük sihirli patlama oluştur
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(this.targetX, this.targetY, this.spell.color, true));
        }

        // Hayalet vuruldu mu kontrol et
        ghosts.forEach(ghost => {
          const pos = ghost.getScreenPosition();
          if (!pos || ghost.isDying) return;

          const dist = Math.hypot(this.targetX - pos.x, this.targetY - pos.y);
          if (dist < 75 * pos.scale) {
            ghost.health -= this.spell.damage;
            if (navigator.vibrate) navigator.vibrate(40);

            if (ghost.health <= 0) {
              ghost.isDying = true;
              playGhostDeathSound();
              score += 150;
              scoreText.textContent = score;
            } else {
              score += 25;
              scoreText.textContent = score;
            }
          }
        });
      }

      draw() {
        ctx.save();
        ctx.strokeStyle = this.spell.color;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.spell.color;

        // Zikzaklı / Yıldırım Büyü Hattı
        ctx.beginPath();
        ctx.moveTo(this.startX, this.startY);
        const steps = 6;
        for (let i = 1; i <= steps; i++) {
          const t = (i / steps) * this.progress;
          const x = this.startX + (this.targetX - this.startX) * t + (Math.random() - 0.5) * 12;
          const y = this.startY + (this.targetY - this.startY) * t + (Math.random() - 0.5) * 12;
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Çekirdek Beyaz Işık
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color, isExplosion = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        const speed = isExplosion ? 3 + Math.random() * 6 : 1 + Math.random() * 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.size = 3 + Math.random() * 3.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.035;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- IŞIKLI KEDİ AYAK İZLERİ (LIGHT FOOTPRINTS) ---
    class LightFootprint {
      constructor(x, y, angle = 0) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.alpha = 0.95;
        this.scale = 1;
      }
      update() {
        this.alpha -= 0.012; // ~4 saniye boyunca yerde kalsın
        this.scale += 0.003;
      }
      draw(targetCtx) {
        if (this.alpha <= 0) return;
        targetCtx.save();
        targetCtx.globalAlpha = Math.max(0, this.alpha);
        targetCtx.translate(this.x, this.y);
        targetCtx.rotate(this.angle);
        targetCtx.scale(this.scale, this.scale);

        targetCtx.fillStyle = "#a2d2ff";
        targetCtx.shadowBlur = 16;
        targetCtx.shadowColor = "#00f5d4";

        // Ana pati yastığı
        targetCtx.beginPath();
        targetCtx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // 4 adet sevimli parmak izi
        const toes = [
          { x: -7, y: -7, r: 2.5 },
          { x: -2.5, y: -9.5, r: 2.8 },
          { x: 2.5, y: -9.5, r: 2.8 },
          { x: 7, y: -7, r: 2.5 }
        ];
        toes.forEach(t => {
          targetCtx.beginPath();
          targetCtx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
          targetCtx.fill();
        });
        targetCtx.restore();
      }
    }

    // --- GERÇEK 3D BRITISH SHORTHAIR PATRONUS (LORD BOBAN / OZZY) ---
    const lightTrails = [];
    let activeCat = null;
    const catBadge = document.getElementById("catBadge");
    const catTimer = document.getElementById("catTimer");

    class BritishShorthairPatronus {
      constructor() {
        this.duration = 10000; // 10 saniye kutsal koruma
        this.startTime = Date.now();
        this.isAlive = true;
        this.walkCycle = 0;
        this.blinkTimer = 0;
        this.isBlinking = false;

        // Ekranın önünde süzülerek gezinme parametreleri
        this.xOffset = 0;
        this.yOffset = 0;
        this.facing = 1; // 1: sağa bakar, -1: sola bakar
        this.stepCounter = 0;

        catBadge.style.display = "flex";
        ghostCountText.innerHTML = "🛡️ SANCTUARY: Lord Boban Protected You!";
        ghostCountText.style.color = "#a2d2ff";

        // Salondaki tüm aktif hayaletleri anında yok et
        ghosts.forEach(g => {
          g.isDying = true;
          g.alpha = 0;
        });

        // Çağrılma anında 25 adet ilahi gümüş-mavi yıldız parçacığı saç
        const startX = width / 2;
        const startY = height * 0.52;
        for (let i = 0; i < 25; i++) {
          particles.push(new Particle(startX, startY, "#a2d2ff", true));
        }
      }

      update() {
        const elapsed = Date.now() - this.startTime;
        const remaining = Math.max(0, (this.duration - elapsed) / 1000);
        catTimer.textContent = remaining.toFixed(1);

        if (remaining <= 0) {
          this.isAlive = false;
          catBadge.style.display = "none";
          ghostCountText.textContent = "Active Specters: 3";
          ghostCountText.style.color = "#ff758f";

          // Kaybolurken parlak altın yıldız patlaması
          const endX = width / 2 + this.xOffset;
          const endY = height * 0.52 + this.yOffset;
          for (let i = 0; i < 30; i++) {
            particles.push(new Particle(endX, endY, "#ffd166", true));
          }
          return;
        }

        // Yürüme döngüsü
        this.walkCycle += 0.055;
        this.stepCounter++;

        // Ekranın önünde AR süzülme ve gezinme (Sağa sola salınıp yön değiştirme)
        const wanderRange = Math.min(width * 0.28, 170);
        const prevOffset = this.xOffset;
        this.xOffset = Math.sin(this.walkCycle * 0.45) * wanderRange;
        this.facing = (this.xOffset >= prevOffset) ? 1 : -1;
        this.yOffset = Math.sin(this.walkCycle * 1.5) * 14;

        // Gerçekçi Göz Kırpma Döngüsü
        this.blinkTimer++;
        if (this.blinkTimer > 130 && Math.random() < 0.06) {
          this.isBlinking = true;
          if (this.blinkTimer > 142) {
            this.isBlinking = false;
            this.blinkTimer = 0;
          }
        }

        // Pati İzleri Bırakma (Her adımda yerde ışık izi oluşturur)
        if (this.stepCounter % 18 === 0) {
          const footX = width / 2 + this.xOffset + (this.facing * -20);
          const footY = height * 0.52 + this.yOffset + 50;
          lightTrails.push(new LightFootprint(footX, footY, this.facing > 0 ? 0.15 : -0.15));
          for (let p = 0; p < 2; p++) {
            particles.push(new Particle(footX, footY, "#a2d2ff"));
          }
        }
      }

      draw(targetCtx) {
        if (!this.isAlive) return;

        const posX = width / 2 + this.xOffset;
        const posY = height * 0.52 + this.yOffset;
        const walkBob = Math.sin(this.walkCycle * 3) * 5;
        const legSwing = Math.sin(this.walkCycle * 3) * 14;
        const tailWag = Math.sin(this.walkCycle * 2) * 0.25;

        targetCtx.save();
        targetCtx.translate(posX, posY + walkBob);
        targetCtx.scale(this.facing * 1.3, 1.3); // Görkemli boyut

        // 1. Dış Halka: Patronus Gümüş-Mavi İlahi Sis ve Işık Halesi (Odayı aydınlatır)
        const auraGrad = targetCtx.createRadialGradient(0, 0, 20, 0, 0, 180);
        auraGrad.addColorStop(0, "rgba(202, 240, 248, 0.7)");
        auraGrad.addColorStop(0.35, "rgba(162, 210, 255, 0.45)");
        auraGrad.addColorStop(0.7, "rgba(74, 105, 132, 0.2)");
        auraGrad.addColorStop(1, "rgba(162, 210, 255, 0)");
        targetCtx.fillStyle = auraGrad;
        targetCtx.beginPath();
        targetCtx.arc(0, 0, 180, 0, Math.PI * 2);
        targetCtx.fill();

        // 2. Lord Boban Kutsal Altın Halesi & Tacı 👑
        targetCtx.save();
        targetCtx.strokeStyle = "#ffd166";
        targetCtx.lineWidth = 4;
        targetCtx.shadowBlur = 18;
        targetCtx.shadowColor = "#ffd166";
        targetCtx.beginPath();
        targetCtx.ellipse(32, -62, 24, 8, 0, 0, Math.PI * 2);
        targetCtx.stroke();

        // Minik Halede Dönen Kutsal Yıldız
        const haloStarAngle = this.walkCycle * 2;
        const starX = 32 + Math.cos(haloStarAngle) * 24;
        const starY = -62 + Math.sin(haloStarAngle) * 8;
        targetCtx.fillStyle = "#ffffff";
        targetCtx.beginPath();
        targetCtx.arc(starX, starY, 3, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();

        // 3. Kalın ve Pofuduk Kuyruk (Thick British Shorthair Tail)
        targetCtx.save();
        targetCtx.shadowBlur = 20;
        targetCtx.shadowColor = "#a2d2ff";
        targetCtx.strokeStyle = "#5a6672";
        targetCtx.lineWidth = 18;
        targetCtx.lineCap = "round";
        targetCtx.beginPath();
        targetCtx.moveTo(-45, 10);
        targetCtx.quadraticCurveTo(-75 + Math.sin(tailWag) * 15, -20 + tailWag * 30, -85, -45 + tailWag * 25);
        targetCtx.stroke();
        // Kuyruk iç aydınlatması
        targetCtx.strokeStyle = "#7c8b99";
        targetCtx.lineWidth = 10;
        targetCtx.stroke();
        targetCtx.restore();

        // 4. Arka Bacaklar (Back Legs - Step Cycle)
        this.drawLeg(targetCtx, -28, 22, -legSwing, "#4a545e");
        this.drawLeg(targetCtx, 22, 22, legSwing, "#4a545e");

        // 5. Tombul British Shorthair 3D Gövde
        targetCtx.save();
        targetCtx.shadowBlur = 24;
        targetCtx.shadowColor = "#a2d2ff";

        // 3D Hacimli Küresel Gövde Gradyanı
        const bodyGrad = targetCtx.createRadialGradient(-10, -5, 5, 0, 5, 50);
        bodyGrad.addColorStop(0, "#8897a6");  // Üst ışık
        bodyGrad.addColorStop(0.5, "#626f7b"); // Ana duman grisi
        bodyGrad.addColorStop(1, "#434c54");   // Alt gölge
        targetCtx.fillStyle = bodyGrad;

        targetCtx.beginPath();
        targetCtx.ellipse(0, 10, 52, 36, 0.08, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();

        // 6. Ön Bacaklar (Front Legs - Step Cycle)
        this.drawLeg(targetCtx, -20, 24, legSwing, "#626f7b");
        this.drawLeg(targetCtx, 30, 24, -legSwing, "#626f7b");

        // 7. Meşhur Yuvarlak Kafa (Classic Round British Shorthair Head)
        targetCtx.save();
        targetCtx.shadowBlur = 22;
        targetCtx.shadowColor = "#a2d2ff";

        const headGrad = targetCtx.createRadialGradient(28, -24, 6, 32, -18, 38);
        headGrad.addColorStop(0, "#94a4b4");  // Alın ışığı
        headGrad.addColorStop(0.6, "#64727f"); // Baş kürk rengi
        headGrad.addColorStop(1, "#424c55");   // Çene altı gölgesi
        targetCtx.fillStyle = headGrad;

        targetCtx.beginPath();
        targetCtx.arc(32, -18, 32, 0, Math.PI * 2);
        targetCtx.fill();

        // 8. Pofuduk Tombul Yanaklar (Famous Chubby Cheeks from Video!)
        const cheekGrad = targetCtx.createRadialGradient(42, -10, 2, 42, -10, 18);
        cheekGrad.addColorStop(0, "#8c9cae");
        cheekGrad.addColorStop(1, "#56626d");
        targetCtx.fillStyle = cheekGrad;

        // Sağ tombul yanak
        targetCtx.beginPath();
        targetCtx.arc(46, -10, 16, 0, Math.PI * 2);
        targetCtx.fill();
        // Sol tombul yanak
        targetCtx.beginPath();
        targetCtx.arc(22, -10, 15, 0, Math.PI * 2);
        targetCtx.fill();

        // 9. Yuvarlak Uçlu Kulaklar (British Shorthair Round-Tipped Ears)
        this.drawEar(targetCtx, 16, -42, -0.2);
        this.drawEar(targetCtx, 42, -42, 0.2);

        // 10. Sevimli Pembe-Gri Burun & Ağız Çizgisi
        targetCtx.fillStyle = "#d49a9a";
        targetCtx.beginPath();
        targetCtx.moveTo(40, -14);
        targetCtx.lineTo(46, -14);
        targetCtx.lineTo(43, -10);
        targetCtx.closePath();
        targetCtx.fill();

        // Ağız (w şekli)
        targetCtx.strokeStyle = "#3d464e";
        targetCtx.lineWidth = 2.2;
        targetCtx.beginPath();
        targetCtx.arc(39, -8, 5, 0.1, Math.PI * 0.9);
        targetCtx.stroke();
        targetCtx.beginPath();
        targetCtx.arc(47, -8, 5, 0.1, Math.PI * 0.9);
        targetCtx.stroke();

        // Bıyık Noktaları ve Gümüş Işıltılı Bıyıklar
        targetCtx.strokeStyle = "rgba(255, 255, 255, 0.75)";
        targetCtx.lineWidth = 1.2;
        // Sağ bıyıklar
        targetCtx.beginPath(); targetCtx.moveTo(48, -10); targetCtx.lineTo(74, -14); targetCtx.stroke();
        targetCtx.beginPath(); targetCtx.moveTo(48, -8); targetCtx.lineTo(76, -7); targetCtx.stroke();
        targetCtx.beginPath(); targetCtx.moveTo(48, -6); targetCtx.lineTo(72, 1); targetCtx.stroke();
        // Sol bıyıklar
        targetCtx.beginPath(); targetCtx.moveTo(35, -10); targetCtx.lineTo(12, -14); targetCtx.stroke();
        targetCtx.beginPath(); targetCtx.moveTo(35, -8); targetCtx.lineTo(10, -7); targetCtx.stroke();
        targetCtx.beginPath(); targetCtx.moveTo(35, -6); targetCtx.lineTo(14, 1); targetCtx.stroke();

        // 11. BÜYÜLEYİCİ KEHRİBAR / ALTIN GÖZLER (Videodaki Ozzy Gözleri)
        if (this.isBlinking) {
          // Göz kırpma çizgisi
          targetCtx.strokeStyle = "#222";
          targetCtx.lineWidth = 3;
          targetCtx.beginPath(); targetCtx.moveTo(22, -22); targetCtx.lineTo(32, -22); targetCtx.stroke();
          targetCtx.beginPath(); targetCtx.moveTo(38, -22); targetCtx.lineTo(48, -22); targetCtx.stroke();
        } else {
          // Sol ve Sağ Kehribar Göz
          this.drawAmberEye(targetCtx, 27, -22);
          this.drawAmberEye(targetCtx, 44, -22);
        }

        targetCtx.restore(); // Head restore
        targetCtx.restore(); // Main cat restore
      }

      drawLeg(targetCtx, x, y, swing, color) {
        targetCtx.save();
        targetCtx.translate(x, y);
        targetCtx.rotate((swing * Math.PI) / 180);
        targetCtx.fillStyle = color;
        targetCtx.beginPath();
        targetCtx.rect(-7, 0, 14, 26);
        targetCtx.fill();
        // Yuvarlak sevimli pati
        targetCtx.fillStyle = "#8393a2";
        targetCtx.beginPath();
        targetCtx.ellipse(0, 26, 8, 5, 0, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();
      }

      drawEar(targetCtx, x, y, rot) {
        targetCtx.save();
        targetCtx.translate(x, y);
        targetCtx.rotate(rot);
        // Dış kürk
        targetCtx.fillStyle = "#566370";
        targetCtx.beginPath();
        targetCtx.moveTo(-10, 10);
        targetCtx.lineTo(0, -18);
        targetCtx.lineTo(10, 10);
        targetCtx.closePath();
        targetCtx.fill();
        // İç pembe kulak
        targetCtx.fillStyle = "#a68c9c";
        targetCtx.beginPath();
        targetCtx.moveTo(-6, 8);
        targetCtx.lineTo(0, -12);
        targetCtx.lineTo(6, 8);
        targetCtx.closePath();
        targetCtx.fill();
        targetCtx.restore();
      }

      drawAmberEye(targetCtx, x, y) {
        targetCtx.save();
        // Göz Yuvarlağı Kehribar / Altın Gradyanı (Ozzy)
        const eyeGrad = targetCtx.createRadialGradient(x, y, 1, x, y, 7.5);
        eyeGrad.addColorStop(0, "#ffd166"); // İç parlak altın sarısı
        eyeGrad.addColorStop(0.7, "#ff9f1c"); // Zengin kehribar / amber
        eyeGrad.addColorStop(1, "#b45309");  // Dış koyu çerçeve
        targetCtx.fillStyle = eyeGrad;
        targetCtx.shadowBlur = 12;
        targetCtx.shadowColor = "#ffb703";

        targetCtx.beginPath();
        targetCtx.arc(x, y, 7.5, 0, Math.PI * 2);
        targetCtx.fill();

        // Dikey Kedi Göz Bebeği (Pupil)
        targetCtx.fillStyle = "#0a0a0a";
        targetCtx.shadowBlur = 0;
        targetCtx.beginPath();
        targetCtx.ellipse(x, y, 2.4, 6.2, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // Beyaz Işık Yansıması (Canlılık Parıltısı)
        targetCtx.fillStyle = "#ffffff";
        targetCtx.beginPath();
        targetCtx.arc(x - 2.2, y - 2.5, 2, 0, Math.PI * 2);
        targetCtx.arc(x + 1.8, y + 2.2, 1, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();
      }
    }

    // --- BÜYÜ YAPMA (Ekrana Dokununca Ateşle) ---
    function castSpell(targetX, targetY) {
      initAudio();
      const spell = SPELLS[selectedSpell];

      // Ekran Flaşı
      flashOverlay.style.background = spell.flash;
      flashOverlay.style.opacity = "1";
      setTimeout(() => { flashOverlay.style.opacity = "0"; }, 100);

      playSpellSound(selectedSpell);
      if (navigator.vibrate) navigator.vibrate(35);

      spellBeams.push(new SpellBeam(targetX, targetY, selectedSpell));

      // EXPECTO PATRONUM atılırsa: Kedi Patronus u (Ozzy / Boban) çağır!
      if (selectedSpell === "patronum") {
        activeCat = new BritishShorthairPatronus();
      }
    }

    // Ekranın ortasına veya dokunulan noktaya büyü at
    canvas.addEventListener("click", (e) => {
      castSpell(e.clientX, e.clientY);
    });

    // Nişangah Takibi (Bir hayalete kilitlendiğinde kırmızıya dönsün)
    function checkCrosshairLock() {
      if (activeCat && activeCat.isAlive) {
        crosshair.classList.remove("locked");
        return;
      }

      let isLocked = false;
      ghosts.forEach(ghost => {
        const pos = ghost.getScreenPosition();
        if (!pos || ghost.isDying) return;
        const dist = Math.hypot(width / 2 - pos.x, height / 2 - pos.y);
        if (dist < 60 * pos.scale) isLocked = true;
      });

      if (isLocked) crosshair.classList.add("locked");
      else crosshair.classList.remove("locked");
    }

    // --- ANA OYUN DÖNGÜSÜ (Game Loop) ---
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // 1. Kedinin Bıraktığı Zemin Işık İzlerini Çiz ve Güncelle
      for (let i = lightTrails.length - 1; i >= 0; i--) {
        const trail = lightTrails[i];
        trail.update();
        trail.draw(ctx);
        if (trail.alpha <= 0) lightTrails.splice(i, 1);
      }

      // 2. Gerçek 3D Ruh Kedisi (Lord Boban - British Shorthair Patronus)
      if (activeCat) {
        activeCat.update();
        if (activeCat.isAlive) {
          activeCat.draw(ctx);
        } else {
          activeCat = null;
        }
      }

      // 3. Kutsal Koruma (Sanctuary): Kedi ekrandayken ASLA hayalet gelmez, var olanlar kaçar!
      if (activeCat && activeCat.isAlive) {
        ghosts.forEach(ghost => {
          ghost.alpha = Math.max(0, ghost.alpha - 0.08);
          if (ghost.alpha > 0) ghost.draw();
        });
      } else {
        // Kedi yokken normal hayaletler oyunda aktif olur
        ghosts.forEach(ghost => {
          ghost.update();
          ghost.draw();
        });
      }

      // Büyü Işınlarını Çiz
      for (let i = spellBeams.length - 1; i >= 0; i--) {
        const beam = spellBeams[i];
        beam.update();
        beam.draw();
        if (beam.isDone) spellBeams.splice(i, 1);
      }

      // Parçacıkları Çiz
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      checkCrosshairLock();
      requestAnimationFrame(gameLoop);
    }

    // Başlat Butonuna Basınca
    document.getElementById("startBtn").addEventListener("click", () => {
      initAudio();
      startCamera();
      document.getElementById("startModal").style.display = "none";
      gameLoop();
    });
  </script>
