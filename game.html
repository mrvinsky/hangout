<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hogwarts AR Ghostbusters ⚡ - Three.js WebGL Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="js/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    /* Kamera Akışı (Video) */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
    }

    /* Fallback Simüle Edilmiş Oda (Kamera İzni Yoksa) */
    #simulatedRoom {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1329 0%, #08050d 100%);
      z-index: 1;
      display: none;
    }

    /* WebGL Three.js Canvas'ı */
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* UI Arayüz Katmanı */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    /* Üst Bar: Skor, Can, Radar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 10, 25, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .title-area h2 {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      color: #ffd166;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
    }

    .score-badge {
      font-size: 20px;
      font-weight: 800;
      color: #00f5d4;
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.6);
    }

    .ghost-radar {
      font-size: 13px;
      color: #ff758f;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    /* Hedef Nişangahı (Crosshair) */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border: 2px dashed rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #crosshair::after {
      content: '';
      width: 6px;
      height: 6px;
      background: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffd166;
    }

    #crosshair.locked {
      border-color: #ff0055;
      width: 58px;
      height: 58px;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      animation: pulseLock 0.4s infinite alternate;
    }

    @keyframes pulseLock {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Alt Kısım: Büyü Çubuğu (Spell Dock) */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spell-dock {
      display: flex;
      gap: 12px;
      background: rgba(15, 10, 25, 0.7);
      backdrop-filter: blur(14px);
      padding: 8px 14px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
    }

    .spell-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .spell-slot.active {
      transform: scale(1.15) translateY(-6px);
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.2);
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.8);
    }

    .spell-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 1px 4px #000;
      font-weight: 600;
    }

    /* Büyü Ekran Flaşı */
    #flashOverlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.08s ease-out;
    }

    /* Başlangıç Modalı */
    #startModal {
      position: fixed;
      inset: 0;
      background: rgba(8, 5, 15, 0.92);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .modal-box {
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .modal-box h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: #ffd166;
      text-shadow: 0 0 15px rgba(255, 209, 102, 0.7);
    }

    .modal-box p {
      font-size: 14px;
      line-height: 1.6;
      color: #ddd;
    }

    .primary-btn {
      background: linear-gradient(135deg, #ffd166, #ffb703);
      color: #000;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 209, 102, 0.5);
      transition: transform 0.2s;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    /* Lord Boban Aktif Rozeti */
    #catBadge {
      display: none;
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid #ffd166;
      border-radius: 20px;
      padding: 6px 16px;
      color: #ffd166;
      font-weight: 700;
      font-size: 13px;
      z-index: 25;
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.5);
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Kamera Video Akışı (AR Arka Planı) -->
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div id="simulatedRoom"></div>

  <!-- WebGL Three.js Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Büyü Ekran Flaşı -->
  <div id="flashOverlay"></div>

  <!-- Hedef Nişangahı -->
  <div id="crosshair"></div>

  <!-- Kedi Aktif Rozeti -->
  <div id="catBadge">
    <span>🛡️ LORD BOBAN SANCTUARY</span>
    <span id="catTimer" style="background:#ffd166; color:#000; padding:2px 8px; border-radius:10px; font-size:11px;">10.0s</span>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="top-bar">
      <div class="title-area">
        <h2>HOGWARTS AR</h2>
        <div class="ghost-radar" id="ghostCountText">Active Specters: 3</div>
      </div>
      <div class="score-badge" id="scoreText">0 PTS</div>
    </div>

    <div class="bottom-bar">
      <div class="spell-desc" id="spellLabel">Expecto Patronum: Lord Boban 3D Spirit Cat 🐾</div>
      <div class="spell-dock">
        <div class="spell-slot active" data-spell="patronum" title="Expecto Patronum">🐾</div>
      </div>
    </div>
  </div>

  <!-- Başlangıç Modalı -->
  <div id="startModal">
    <div class="modal-box">
      <h1>HOGWARTS AR</h1>
      <p>Odanı koruyan Hogwarts hayaletlerini yok et! Asanı salla, ekrana dokun ve Maşa'nın kutsal kedisi <b>Lord Boban'ın 3D Parçacık Patronusu</b>'nu çağır!</p>
      <button class="primary-btn" id="startBtn">ASANI ÇEK & BAŞLA ⚡</button>
    </div>
  </div>

  <script>
    // --- SES SENTEZLEYİCİSİ (Web Audio API) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSpellSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'patronum') {
        // Epik Kutsal Patronus Akoru & Şelale Çanları
        [220, 277.18, 329.63, 440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 1.2);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.15, now + 0.15 + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + 2.6);
        });
      }
    }

    function playGhostDefeatedSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.45);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.48);
    }

    // --- KAMERA YÖNETİMİ ---
    const videoEl = document.getElementById("cameraVideo");
    const simulatedRoom = document.getElementById("simulatedRoom");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoEl.srcObject = stream;
        videoEl.play();
      } catch (err) {
        console.warn("Kamera açılamadı, simüle oda devrede:", err);
        simulatedRoom.style.display = "block";
      }
    }

    // --- THREE.JS WEBGL SAHNE KURULUMU ---
    const canvas = document.getElementById("gameCanvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 160);
    camera.lookAt(0, 0, 0);

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(50, 100, 80);
    scene.add(dirLight);

    // Pencere Boyutu Değişimi
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Kamera Bakış / Gyro Kontrolü (AR 360 Derece Görüş)
    let camYaw = 0;
    let camPitch = 0;
    let targetYaw = 0;
    let targetPitch = 0;

    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", (e) => {
        if (e.alpha !== null && e.beta !== null) {
          targetYaw = (e.alpha * Math.PI) / 180;
          targetPitch = ((e.beta - 90) * Math.PI) / 180 * 0.5;
        }
      });
    }

    // Masaüstü ve Dokunmatik Sürükleme ile Bakış
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    window.addEventListener("pointerdown", (e) => {
      if (e.clientY < window.innerHeight - 100) {
        isDragging = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      targetYaw -= dx * 0.005;
      targetPitch -= dy * 0.005;
      targetPitch = Math.max(-0.6, Math.min(0.6, targetPitch));
    });

    window.addEventListener("pointerup", () => { isDragging = false; });
    window.addEventListener("pointercancel", () => { isDragging = false; });

    // --- SPRITESHEET YÜKLEME ---
    const textureLoader = new THREE.TextureLoader();
    let catSpriteTexture = textureLoader.load("boban_patronus_sheet.webp", undefined, undefined, () => {
      catSpriteTexture = textureLoader.load("boban_patronus_sheet.png");
    });
    catSpriteTexture.minFilter = THREE.LinearFilter;
    catSpriteTexture.magFilter = THREE.LinearFilter;
    catSpriteTexture.generateMipmaps = false;

    // --- GERÇEK 3D HACİMSEL DENSE PARTICLE BOBAN (229,620 PARÇACIK - SIFIR BOŞLUK) ---
    const VERTEX_SHADER_PATRONUS = `
      uniform sampler2D uSpriteSheet;
      uniform vec2 uFrameOffset;
      uniform vec2 uFrameSize;
      uniform float uTime;
      uniform float uDepthScale;
      uniform float uPointSize;

      attribute float aLayerSign;

      varying vec4 vColor;
      varying float vAlpha;

      void main() {
        // Spritesheet koordinatları
        vec2 sheetUv = vec2(
          uFrameOffset.x + uv.x * uFrameSize.x,
          uFrameOffset.y + (1.0 - uv.y) * uFrameSize.y
        );
        vec4 texColor = texture2D(uSpriteSheet, sheetUv);

        // Şeffaf pikselleri gizle
        if (texColor.a < 0.12) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          gl_PointSize = 0.0;
          return;
        }

        // Gerçek 3D Hacimsel Derinlik Hesaplaması (Volumetric Cat Z Extrusion)
        // Gövde merkezi (uv.x = 0.48, uv.y = 0.52)
        float dx = (uv.x - 0.48) * 1.85;
        float dy = (uv.y - 0.52) * 2.05;
        float distSq = dx * dx + dy * dy;
        float thickness = sqrt(max(0.0, 1.0 - distSq)) * uDepthScale;

        // Katmana göre Z derinliği (+Z ön yüz, -Z arka yüz, 0 iç hacim)
        float z = aLayerSign * thickness;

        // Kedinin nefes alıp verme ve gövde salınımı
        z += sin(uTime * 3.5 + uv.x * 6.5) * 0.7;

        // Yerel 3D Kedi Konumu (Ölçek: ~58 x 44 x Z)
        vec3 localPos = vec3(
          (uv.x - 0.5) * 58.0,
          (0.5 - uv.y) * 44.0,
          z
        );

        vec4 mvPosition = modelViewMatrix * vec4(localPos, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        // Perspektife Göre Parçacık Boyutu (Noktalar örtüşür, aralarında SIFIR BOŞLUK kalır!)
        gl_PointSize = (uPointSize / -mvPosition.z) * 360.0;

        vColor = texColor;
        vAlpha = texColor.a;
      }
    `;

    const FRAGMENT_SHADER_PATRONUS = `
      varying vec4 vColor;
      varying float vAlpha;

      void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        float dist = length(coord);
        if (dist > 0.5) discard;

        // Kadife gibi yumuşak dairesel geçiş (Soft Velvet Falloff)
        float softAlpha = smoothstep(0.5, 0.08, dist) * vAlpha;

        // Saf British Shorthair Kül Grisi Kürk Rengi
        vec3 col = vColor.rgb;

        // Dış kenarlarda parıldayan gümüşi Patronus ışığı (Silver-White Rim Starlight)
        col += vec3(0.26, 0.34, 0.42) * pow(dist, 1.55);

        gl_FragColor = vec4(col, softAlpha);
      }
    `;

    // 229,620 Parçacıklı 3D Kedi Geometrisi Oluşturucu
    function create3DPatronusGeometry() {
      const fw = 258, fh = 178;
      const layers = [-1.0, -0.5, 0.0, 0.5, 1.0]; // 5 Hacimsel Derinlik Katmanı
      const totalVerts = fw * fh * layers.length;

      const uvs = new Float32Array(totalVerts * 2);
      const layerSigns = new Float32Array(totalVerts);

      let idx = 0;
      for (let l = 0; l < layers.length; l++) {
        const sign = layers[l];
        for (let y = 0; y < fh; y++) {
          for (let x = 0; x < fw; x++) {
            uvs[idx * 2] = x / fw;
            uvs[idx * 2 + 1] = y / fh;
            layerSigns[idx] = sign;
            idx++;
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
      geo.setAttribute("aLayerSign", new THREE.BufferAttribute(layerSigns, 1));
      return geo;
    }

    const patronusGeometry = create3DPatronusGeometry();

    // --- 3D DUMAN VE BUHAR ŞERİTLERİ (3D VAPOR TENDRILS) ---
    class VaporParticle3D {
      constructor(pos, vel) {
        this.pos = pos.clone();
        this.vel = vel.clone();
        this.life = 0;
        this.maxLife = 35 + Math.random() * 20;
        this.size = 2.5 + Math.random() * 3.0;
        this.alpha = 0.8;
      }
      update() {
        this.life++;
        this.pos.add(this.vel);
        this.pos.y += 0.25;
        this.vel.x += Math.sin(this.life * 0.2) * 0.08;
        this.alpha = Math.max(0, 1 - this.life / this.maxLife);
      }
    }

    // --- 3D ELMAS YILDIZ TOZU (3D STARLIGHT SPARKLES ✨) ---
    class SparkleParticle3D {
      constructor(pos) {
        this.pos = pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 8));
        this.vel = new THREE.Vector3((Math.random() - 0.5) * 0.4, -0.3 - Math.random() * 0.5, (Math.random() - 0.5) * 0.4);
        this.life = 0;
        this.maxLife = 28 + Math.random() * 15;
        this.color = Math.random() < 0.25 ? new THREE.Color(0xffd166) : new THREE.Color(0xffffff);
        this.alpha = 1.0;
      }
      update() {
        this.life++;
        this.pos.add(this.vel);
        this.alpha = Math.max(0, 1 - this.life / this.maxLife);
      }
    }

    // --- LORD BOBAN 3D PATRONUS SINIFI ---
    class BritishShorthairPatronus3D {
      constructor() {
        this.duration = 10000; // 10 saniye kutsal koruma
        this.startTime = Date.now();
        this.isAlive = true;
        this.time = 0;

        // 3D Kök Grup
        this.group = new THREE.Group();
        this.group.position.set(0, -10, 0);

        // Shader Malzemesi
        this.uniforms = {
          uSpriteSheet: { value: catSpriteTexture },
          uFrameOffset: { value: new THREE.Vector2(0, 0.75) },
          uFrameSize: { value: new THREE.Vector2(0.25, 0.25) },
          uTime: { value: 0 },
          uDepthScale: { value: 14.0 }, // 3D Hacimsel Kalınlık
          uPointSize: { value: 4.2 }    // Sıfır Boşluk Sağlayan Örtüşme
        };

        this.material = new THREE.ShaderMaterial({
          uniforms: this.uniforms,
          vertexShader: VERTEX_SHADER_PATRONUS,
          fragmentShader: FRAGMENT_SHADER_PATRONUS,
          transparent: true,
          depthWrite: false
        });

        // 3D Parçacık Modeli
        this.particleMesh = new THREE.Points(patronusGeometry, this.material);
        this.group.add(this.particleMesh);

        // Kutsal Altın Taç / Hale (Royal Halo of Lord Boban 👑)
        const haloGeo = new THREE.TorusGeometry(7.5, 0.65, 16, 40);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
        this.haloMesh = new THREE.Mesh(haloGeo, haloMat);
        this.haloMesh.rotation.x = Math.PI * 0.45;
        this.haloMesh.position.set(13, 26, 0);
        this.group.add(this.haloMesh);

        // Odayı Aydınlatan Kutsal Gümüş Işık
        this.auraLight = new THREE.PointLight(0xffffff, 2.2, 120);
        this.auraLight.position.set(0, 10, 15);
        this.group.add(this.auraLight);

        scene.add(this.group);

        // Yürüyüş Animasyonu (16 Kare Döngü)
        this.frameIdx = 0;
        this.frameTimer = 0;
        this.frameDelay = 3;

        // 3D Odada Gezinme (3D Autonomous Waypoints)
        this.speed = 1.25;
        this.pickNewDestination();

        // Canlı Duman ve Parıltı Sistemleri
        this.vaporParticles = [];
        this.sparkleParticles = [];
        this.initTrailSystems();

        // Kutsal Kalkan UI
        const catBadge = document.getElementById("catBadge");
        catBadge.style.display = "flex";
        document.getElementById("ghostCountText").innerHTML = "🛡️ SANCTUARY: Lord Boban Protected You!";
        document.getElementById("ghostCountText").style.color = "#ffd166";

        // Salondaki tüm hayaletleri hemen yok et
        ghosts.forEach(g => { g.isDying = true; g.alpha = 0; });
      }

      initTrailSystems() {
        // Duman için dinamik Three.js Points sistemi
        this.maxVapor = 150;
        this.vaporGeo = new THREE.BufferGeometry();
        this.vaporPositions = new Float32Array(this.maxVapor * 3);
        this.vaporColors = new Float32Array(this.maxVapor * 3);
        this.vaporGeo.setAttribute("position", new THREE.BufferAttribute(this.vaporPositions, 3));
        this.vaporGeo.setAttribute("color", new THREE.BufferAttribute(this.vaporColors, 3));

        const vaporMat = new THREE.PointsMaterial({
          size: 7.0,
          vertexColors: true,
          transparent: true,
          opacity: 0.55,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.vaporSystem = new THREE.Points(this.vaporGeo, vaporMat);
        scene.add(this.vaporSystem);

        // Kıvılcımlar için dinamik Three.js Points sistemi
        this.maxSparkles = 200;
        this.sparkleGeo = new THREE.BufferGeometry();
        this.sparklePositions = new Float32Array(this.maxSparkles * 3);
        this.sparkleColors = new Float32Array(this.maxSparkles * 3);
        this.sparkleGeo.setAttribute("position", new THREE.BufferAttribute(this.sparklePositions, 3));
        this.sparkleGeo.setAttribute("color", new THREE.BufferAttribute(this.sparkleColors, 3));

        const sparkleMat = new THREE.PointsMaterial({
          size: 4.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.sparkleSystem = new THREE.Points(this.sparkleGeo, sparkleMat);
        scene.add(this.sparkleSystem);
      }

      pickNewDestination() {
        this.targetX = (Math.random() - 0.5) * 110;
        this.targetY = -22 + (Math.random() - 0.5) * 18;
        this.targetZ = (Math.random() - 0.5) * 70;
      }

      update() {
        const elapsed = Date.now() - this.startTime;
        const remaining = Math.max(0, (this.duration - elapsed) / 1000);
        document.getElementById("catTimer").textContent = remaining.toFixed(1) + "s";

        if (remaining <= 0) {
          this.destroy();
          return;
        }

        this.time += 0.045;
        this.uniforms.uTime.value = this.time;

        // 3D Hedefe Doğru Yürüme
        const cur = this.group.position;
        const dx = this.targetX - cur.x;
        const dy = this.targetY - cur.y;
        const dz = this.targetZ - cur.z;
        const dist = Math.hypot(dx, dy, dz);

        if (dist < 8) {
          this.pickNewDestination();
        } else {
          cur.x += (dx / dist) * this.speed;
          cur.y += (dy / dist) * (this.speed * 0.4);
          cur.z += (dz / dist) * this.speed;

          // 3D Yönelme Açısı (Y Ekseni Etrafında Gerçek 3D Dönüş)
          const targetAngle = Math.atan2(dx, dz) - Math.PI * 0.5;
          let diff = targetAngle - this.group.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          this.group.rotation.y += diff * 0.08;

          // Yürüyüş karesini güncelle
          this.frameTimer++;
          if (this.frameTimer >= this.frameDelay) {
            this.frameTimer = 0;
            this.frameIdx = (this.frameIdx + 1) % 16;
            const col = this.frameIdx % 4;
            const row = Math.floor(this.frameIdx / 4);
            this.uniforms.uFrameOffset.value.set(col * 0.25, (3 - row) * 0.25);

            // Adım anında zemine 3D kıvılcım dök
            if (this.frameIdx === 0 || this.frameIdx === 8) {
              for (let p = 0; p < 4; p++) {
                const pawPos = cur.clone().add(new THREE.Vector3((Math.random() - 0.5) * 12, -18, (Math.random() - 0.5) * 12));
                this.sparkleParticles.push(new SparkleParticle3D(pawPos));
              }
            }
          }
        }

        // Kutsal Taç Haresinin 3D Dönüşü
        this.haloMesh.rotation.z += 0.035;
        this.haloMesh.position.y = 26 + Math.sin(this.time * 4) * 1.5;

        // Kuyruktan ve sırttan 3D buhar/duman salınımı
        if (Math.random() < 0.5) {
          const tailWorld = cur.clone().add(new THREE.Vector3(-this.group.rotation.y * 12, -2, 0));
          const vel = new THREE.Vector3((Math.random() - 0.5) * 0.4, 0.2, (Math.random() - 0.5) * 0.4);
          this.vaporParticles.push(new VaporParticle3D(tailWorld, vel));
        }

        // Havada süzülen elmas yıldızlar
        if (Math.random() < 0.45) {
          const ambientPos = cur.clone().add(new THREE.Vector3((Math.random() - 0.5) * 45, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 45));
          this.sparkleParticles.push(new SparkleParticle3D(ambientPos));
        }

        // 3D Duman Güncelleme
        const vPos = this.vaporPositions;
        const vCol = this.vaporColors;
        for (let i = this.vaporParticles.length - 1; i >= 0; i--) {
          const v = this.vaporParticles[i];
          v.update();
          if (v.alpha <= 0) this.vaporParticles.splice(i, 1);
        }
        for (let i = 0; i < this.maxVapor; i++) {
          if (i < this.vaporParticles.length) {
            const v = this.vaporParticles[i];
            vPos[i * 3] = v.pos.x;
            vPos[i * 3 + 1] = v.pos.y;
            vPos[i * 3 + 2] = v.pos.z;
            vCol[i * 3] = v.alpha * 0.85;
            vCol[i * 3 + 1] = v.alpha * 0.95;
            vCol[i * 3 + 2] = v.alpha * 1.0;
          } else {
            vPos[i * 3 + 1] = -9999;
          }
        }
        this.vaporGeo.attributes.position.needsUpdate = true;
        this.vaporGeo.attributes.color.needsUpdate = true;

        // 3D Kıvılcım Güncelleme
        const sPos = this.sparklePositions;
        const sCol = this.sparkleColors;
        for (let i = this.sparkleParticles.length - 1; i >= 0; i--) {
          const s = this.sparkleParticles[i];
          s.update();
          if (s.alpha <= 0) this.sparkleParticles.splice(i, 1);
        }
        for (let i = 0; i < this.maxSparkles; i++) {
          if (i < this.sparkleParticles.length) {
            const s = this.sparkleParticles[i];
            sPos[i * 3] = s.pos.x;
            sPos[i * 3 + 1] = s.pos.y;
            sPos[i * 3 + 2] = s.pos.z;
            sCol[i * 3] = s.color.r * s.alpha;
            sCol[i * 3 + 1] = s.color.g * s.alpha;
            sCol[i * 3 + 2] = s.color.b * s.alpha;
          } else {
            sPos[i * 3 + 1] = -9999;
          }
        }
        this.sparkleGeo.attributes.position.needsUpdate = true;
        this.sparkleGeo.attributes.color.needsUpdate = true;
      }

      destroy() {
        this.isAlive = false;
        scene.remove(this.group);
        scene.remove(this.vaporSystem);
        scene.remove(this.sparkleSystem);
        document.getElementById("catBadge").style.display = "none";
        document.getElementById("ghostCountText").textContent = "Active Specters: 3";
        document.getElementById("ghostCountText").style.color = "#ff758f";
      }
    }

    let activeCat3D = null;

    // --- 3D HAYALETLER (GHOSTS) ---
    class Ghost3D {
      constructor() {
        this.theta = Math.random() * Math.PI * 2;
        this.phi = (Math.random() - 0.5) * 0.8;
        this.dist = 110 + Math.random() * 60;
        this.isDying = false;
        this.alpha = 0.85;

        // 3D Hayalet Küresi
        const geo = new THREE.SphereGeometry(7, 16, 16);
        const mat = new THREE.MeshBasicMaterial({
          color: Math.random() > 0.5 ? 0x00f5d4 : 0xff758f,
          transparent: true,
          opacity: 0.8
        });
        this.mesh = new THREE.Mesh(geo, mat);
        scene.add(this.mesh);
        this.updatePosition();
      }

      updatePosition() {
        this.mesh.position.set(
          this.dist * Math.cos(this.phi) * Math.sin(this.theta),
          this.dist * Math.sin(this.phi),
          this.dist * Math.cos(this.phi) * Math.cos(this.theta)
        );
      }

      update() {
        this.theta += 0.006;
        this.phi += Math.sin(this.theta * 2) * 0.002;
        this.updatePosition();

        if (this.isDying) {
          this.alpha = Math.max(0, this.alpha - 0.08);
          this.mesh.material.opacity = this.alpha;
          if (this.alpha <= 0) {
            this.reset();
          }
        }
      }

      reset() {
        this.theta = Math.random() * Math.PI * 2;
        this.phi = (Math.random() - 0.5) * 0.8;
        this.alpha = 0.85;
        this.isDying = false;
        this.mesh.material.opacity = this.alpha;
        this.updatePosition();
      }
    }

    const ghosts = [new Ghost3D(), new Ghost3D(), new Ghost3D()];

    // --- 3D BÜYÜ IŞINI (SPELL BEAM) ---
    class SpellBeam3D {
      constructor(origin, target) {
        this.origin = origin.clone();
        this.target = target.clone();
        this.progress = 0;
        this.isDone = false;

        const points = [this.origin, this.target];
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({ color: 0xffd166, linewidth: 3 });
        this.line = new THREE.Line(geo, mat);
        scene.add(this.line);
      }

      update() {
        this.progress += 0.12;
        if (this.progress >= 1.0) {
          this.isDone = true;
          scene.remove(this.line);
        }
      }
    }

    const activeBeams = [];

    // --- BÜYÜ YAPMA ---
    function castSpell() {
      initAudio();
      playSpellSound("patronum");

      const flash = document.getElementById("flashOverlay");
      flash.style.background = "rgba(255, 255, 255, 0.4)";
      flash.style.opacity = "1";
      setTimeout(() => { flash.style.opacity = "0"; }, 100);

      // Expecto Patronum 3D Lord Boban'ı Çağır
      if (activeCat3D && activeCat3D.isAlive) {
        activeCat3D.destroy();
      }
      activeCat3D = new BritishShorthairPatronus3D();
    }

    window.addEventListener("click", (e) => {
      // Eğer modal açıksa tıklama
      if (document.getElementById("startModal").style.display !== "none") return;
      castSpell();
    });

    // --- ANA OYUN DÖNGÜSÜ (Three.js Render Loop) ---
    function animate() {
      requestAnimationFrame(animate);

      // Kamera Dönüşünü Yumuşat
      camYaw += (targetYaw - camYaw) * 0.1;
      camPitch += (targetPitch - camPitch) * 0.1;
      camera.rotation.set(camPitch, camYaw, 0, 'YXZ');

      // Hayaletler
      if (activeCat3D && activeCat3D.isAlive) {
        ghosts.forEach(g => {
          g.alpha = Math.max(0, g.alpha - 0.08);
          g.mesh.material.opacity = g.alpha;
        });
      } else {
        ghosts.forEach(g => g.update());
      }

      // Kedi
      if (activeCat3D && activeCat3D.isAlive) {
        activeCat3D.update();
      }

      // Büyü Işınları
      for (let i = activeBeams.length - 1; i >= 0; i--) {
        const b = activeBeams[i];
        b.update();
        if (b.isDone) activeBeams.splice(i, 1);
      }

      renderer.render(scene, camera);
    }

    // Başlat Butonuna Basınca
    document.getElementById("startBtn").addEventListener("click", () => {
      initAudio();
      startCamera();
      document.getElementById("startModal").style.display = "none";
      animate();
    });
  </script>
</body>
