<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hogwarts AR Ghostbusters ⚡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Pure Canvas 3D Augmented Reality Engine -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    /* Kamera Akışı (Video) */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1); /* Ayna modu gerekirse ayarlanır */
    }

    /* Fallback Simüle Edilmiş Oda (Kamera İzni Yoksa) */
    #simulatedRoom {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1329 0%, #08050d 100%);
      z-index: 1;
      display: none;
    }

    /* Ana Oyun Canvas'ı (Hayaletler, Büyü Işınları, Parçacıklar) */
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: auto;
    }

    /* UI Arayüz Katmanı */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    /* Üst Bar: Skor, Can, Radar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 10, 25, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .title-area h2 {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      color: #ffd166;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
    }

    .score-badge {
      font-size: 20px;
      font-weight: 800;
      color: #00f5d4;
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.6);
    }

    .ghost-radar {
      font-size: 13px;
      color: #ff758f;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .radar-dot {
      width: 8px;
      height: 8px;
      background: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff0055;
      animation: pulseRadar 1s infinite;
    }

    @keyframes pulseRadar {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Nişangah (Crosshair) */
    .crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border: 2px dashed rgba(255, 215, 0, 0.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .crosshair::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd166;
    }

    .crosshair.locked {
      border-color: #ff0055;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Alt Kısım: Asa ve Büyü Butonları */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .selected-spell-label {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffd166;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Büyü Yuvaları (Spell Dock) */
    .spell-dock {
      display: flex;
      gap: 10px;
      background: rgba(10, 6, 18, 0.75);
      backdrop-filter: blur(16px);
      padding: 10px 14px;
      border-radius: 28px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 100vw;
      overflow-x: auto;
    }

    .spell-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .spell-btn .icon {
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .spell-btn .name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Büyü Renkleri & Aktif Durumlar */
    .spell-btn.stupefy {
      border-color: rgba(255, 42, 109, 0.4);
    }
    .spell-btn.stupefy.active, .spell-btn.stupefy:active {
      background: radial-gradient(circle, #ff2a6d, #70002b);
      border-color: #ff2a6d;
      box-shadow: 0 0 20px #ff2a6d;
      transform: scale(1.08);
    }

    .spell-btn.expelliarmus {
      border-color: rgba(255, 123, 0, 0.4);
    }
    .spell-btn.expelliarmus.active, .spell-btn.expelliarmus:active {
      background: radial-gradient(circle, #ff7b00, #8f3400);
      border-color: #ff7b00;
      box-shadow: 0 0 20px #ff7b00;
      transform: scale(1.08);
    }

    .spell-btn.patronum {
      border-color: rgba(0, 245, 212, 0.4);
    }
    .spell-btn.patronum.active, .spell-btn.patronum:active {
      background: radial-gradient(circle, #00f5d4, #005f52);
      border-color: #00f5d4;
      box-shadow: 0 0 25px #00f5d4;
      transform: scale(1.08);
    }

    .spell-btn.lumos {
      border-color: rgba(255, 215, 0, 0.4);
    }
    .spell-btn.lumos.active, .spell-btn.lumos:active {
      background: radial-gradient(circle, #ffd166, #806200);
      border-color: #ffd166;
      box-shadow: 0 0 20px #ffd166;
      transform: scale(1.08);
    }

    .spell-btn.avada {
      border-color: rgba(57, 255, 20, 0.4);
    }
    .spell-btn.avada.active, .spell-btn.avada:active {
      background: radial-gradient(circle, #39ff14, #0b6100);
      border-color: #39ff14;
      box-shadow: 0 0 25px #39ff14;
      transform: scale(1.08);
    }

    .spell-btn.leviosa {
      border-color: rgba(247, 37, 133, 0.4);
    }
    .spell-btn.leviosa.active, .spell-btn.leviosa:active {
      background: radial-gradient(circle, #f72585, #7209b7);
      border-color: #f72585;
      box-shadow: 0 0 25px #f72585;
      transform: scale(1.08);
    }

    /* Kedi Rozeti */
    .cat-badge {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #ffd166;
      background: rgba(247, 37, 133, 0.25);
      border: 1px solid rgba(255, 209, 102, 0.5);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(247, 37, 133, 0.5);
      animation: catGlow 1.5s infinite alternate;
    }

    @keyframes catGlow {
      from { box-shadow: 0 0 10px rgba(247, 37, 133, 0.4); }
      to { box-shadow: 0 0 25px rgba(255, 209, 102, 0.8); }
    }

    /* Ekran Flaş Efektleri (Büyü Atıldığında) */
    #flashOverlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    /* Başlangıç / İzin Modalı */
    #startModal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle, rgba(16, 9, 29, 0.95), #06030b);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .modal-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 28px;
      padding: 36px 26px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 209, 102, 0.15);
    }

    .modal-card h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      color: #ffd166;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 209, 102, 0.5);
    }

    .modal-card p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-start {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 36px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ffd166, #ff7b00);
      color: #0b0714;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 209, 102, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 209, 102, 0.9);
    }

    /* Asanın Ekranda Görünümü */
    .wand-hud {
      position: fixed;
      bottom: -40px;
      right: 10%;
      width: 180px;
      height: 260px;
      pointer-events: none;
      z-index: 12;
      transform-origin: bottom center;
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body>

  <!-- Başlangıç / İzin Ekranı -->
  <div id="startModal">
    <div class="modal-card">
      <div style="font-size: 48px; margin-bottom: 12px;">⚡ 👻 🪄</div>
      <h1>Hogwarts AR Ghostbusters</h1>
      <p>
        The room is haunted by dark specters! Point your phone around the living room, switch your spells, and tap to cast your magic.
      </p>
      <button class="btn-start" id="startBtn">Draw Your Wand 🪄</button>
    </div>
  </div>

  <!-- Canlı Kamera Akışı -->
  <video id="cameraVideo" playsinline autoplay muted></video>
  <div id="simulatedRoom"></div>

  <!-- Çizim Canvas'ı (Hayaletler + Işınlar) -->
  <canvas id="gameCanvas"></canvas>



  <!-- Büyü Flaş Katmanı -->
  <div id="flashOverlay"></div>

  <!-- Nişangah -->
  <div class="crosshair" id="crosshair"></div>

  <!-- HUD Arayüzü -->
  <div id="hud">
    <div class="top-bar">
      <div class="title-area">
        <h2>DEFENSE AGAINST THE DARK ARTS</h2>
        <div class="ghost-radar">
          <span class="radar-dot"></span>
          <span id="ghostCountText">Active Specters: 3</span>
        </div>
      </div>
      <div class="score-badge">
        <span id="scoreText">0</span> pts
      </div>
    </div>

    <div class="bottom-bar">
      <div class="cat-badge" id="catBadge">
        <span>🐾 EXPECTO PATRONUM: Lord Boban Active (<span id="catTimer">10.0</span>s) 🛡️</span>
      </div>

      <div class="selected-spell-label" id="spellLabel">EXPECTO PATRONUM 🐾</div>

      <div class="spell-dock">
        <!-- EXPECTO PATRONUM: OZZY / BOBAN ÇAĞIRICI (Öncelikli Büyü) -->
        <button class="spell-btn patronum active" data-spell="patronum" style="min-width: 175px; height: 60px; padding: 0 22px;">
          <span class="icon" style="font-size: 24px;">🐾</span>
          <span class="name" style="font-size: 11px; letter-spacing: 1px;">Expecto Patronum</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- SES SENTEZLEYİCİSİ (Web Audio API ile Büyü ve Hayalet Sesleri) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSpellSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'stupefy') {
        // Keskin Kırmızı Büyü Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.28);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      } else if (type === 'expelliarmus') {
        // Ateş / Yanma Sesi (Incendio)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'patronum') {
        // İlahi & Parlak Patronus Çanı
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc2.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1040, now + 0.6);
        osc2.frequency.setValueAtTime(784, now);
        osc2.frequency.exponentialRampToValueAtTime(1568, now + 0.6);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc2.start(now);
        osc.stop(now + 0.71);
        osc2.stop(now + 0.71);

        // Sevimli Kedi Miyavı (Ozzy / Boban)
        setTimeout(() => {
          if (!audioCtx) return;
          const meowNow = audioCtx.currentTime;
          const meowOsc = audioCtx.createOscillator();
          const meowGain = audioCtx.createGain();
          meowOsc.type = 'triangle';
          meowOsc.frequency.setValueAtTime(560, meowNow);
          meowOsc.frequency.exponentialRampToValueAtTime(760, meowNow + 0.14);
          meowOsc.frequency.exponentialRampToValueAtTime(430, meowNow + 0.52);
          meowGain.gain.setValueAtTime(0.01, meowNow);
          meowGain.gain.linearRampToValueAtTime(0.28, meowNow + 0.08);
          meowGain.gain.exponentialRampToValueAtTime(0.01, meowNow + 0.52);
          meowOsc.connect(meowGain);
          meowGain.connect(audioCtx.destination);
          meowOsc.start(meowNow);
          meowOsc.stop(meowNow + 0.53);
        }, 180);
      } else if (type === 'lumos') {
        // Parlama çınlaması
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.41);
      } else if (type === 'avada') {
        // Ölümcül Yeşil Lanet Sesi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.51);
      } else if (type === 'leviosa') {
        // Wingardium Leviosa: Büyülü yükselme ve kedi miyavı sentezi
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.6);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.61);
      }
    }

    function playGhostDeathSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.41);
    }

    // --- KAMERA & GYRO ENTEGRASYONU ---
    const cameraVideo = document.getElementById('cameraVideo');
    const simulatedRoom = document.getElementById('simulatedRoom');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        cameraVideo.srcObject = stream;
        cameraVideo.play();
      } catch (err) {
        console.warn("Camera could not be accessed, using fallback dark chamber:", err);
        simulatedRoom.style.display = 'block';
      }
    }

    // AR Jiroskop / Ekran Döndürme Verileri
    let camYaw = 0;   // Sağa - Sola açı
    let camPitch = 0; // Yukarı - Aşağı açı

    // Telefonun Jiroskop sensörü
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha !== null && e.beta !== null) {
        camYaw = (e.alpha * Math.PI) / 180;
        camPitch = (e.beta * Math.PI) / 180;
      }
    });

    // Bilgisayarda / Dokunmatik ekranda fareyle / sürükleyerek etrafa bakma (Fallback)
    let isDragging = false;
    let startX = 0, startY = 0;
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud') || e.target.closest('#startModal')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      camYaw -= dx * 0.005;
      camPitch += dy * 0.005;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // --- OYUN CANVAS & NESNELER ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const flashOverlay = document.getElementById('flashOverlay');
    const scoreText = document.getElementById('scoreText');
    const ghostCountText = document.getElementById('ghostCountText');
    const crosshair = document.getElementById('crosshair');

    let width, height;
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let selectedSpell = 'patronum';

    // Büyü Tanımları: Kullanıcının isteğiyle sadece Patronus aktif
    const SPELLS = {
      patronum: {
        name: 'Expecto Patronum 🐾 (Lord Boban)',
        color: '#a2d2ff',
        lightColor: 'rgba(162, 210, 255, 0.65)',
        damage: 150,
        speed: 35,
        flash: 'rgba(162, 210, 255, 0.55)'
      }
    };

    // Büyü Seçimi Butonları
    document.querySelectorAll('.spell-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.spell-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSpell = btn.dataset.spell;
        document.getElementById('spellLabel').textContent = SPELLS[selectedSpell].name;
        if (navigator.vibrate) navigator.vibrate(20);

        // EXPECTO PATRONUM butonuna basıldığı an OZZY/BOBAN'ı doğrudan çağır!
        if (selectedSpell === 'patronum') {
          initAudio();
          playSpellSound('patronum');
          activeCat = new BritishShorthairPatronus();
        }
      });
    });

    // --- HAYALETLER (GHOSTS) ---
    class Ghost {
      constructor() {
        this.reset();
      }

      reset() {
        // 3D Küresel Koordinatlar (Salonda 360 derece etrafımızda konumlanırlar)
        this.theta = Math.random() * Math.PI * 2; // Yatay açı
        this.phi = (Math.random() - 0.5) * 1.2;  // Dikey açı
        this.distance = 400 + Math.random() * 300; // Mesafesi

        this.maxHealth = 100;
        this.health = this.maxHealth;
        this.type = Math.random() > 0.4 ? 'slimer' : (Math.random() > 0.5 ? 'dementor' : 'pumpkin');
        this.floatOffset = Math.random() * 100;
        this.alpha = 0.85;
        this.isDying = false;
        this.deathTimer = 0;
      }

      update() {
        // Yavaşça süzülme hareketi
        this.floatOffset += 0.04;
        this.theta += 0.003; // Salon etrafında yavaşça döner

        if (this.isDying) {
          this.deathTimer++;
          this.alpha = Math.max(0, 1 - this.deathTimer / 25);
          if (this.alpha <= 0) {
            this.reset();
          }
        }
      }

      // Ekrana İzdüşümü (3D -> 2D Ekran Konumu)
      getScreenPosition() {
        // Kamera açısına göre fark hesapla
        let relTheta = this.theta - camYaw;
        while (relTheta > Math.PI) relTheta -= Math.PI * 2;
        while (relTheta < -Math.PI) relTheta += Math.PI * 2;

        let relPhi = this.phi - camPitch;

        // Görüş alanı (FOV) sınırları içinde mi?
        const fov = 1.3;
        if (Math.abs(relTheta) > fov) return null; // Arkada kalıyor

        const screenX = width / 2 + (relTheta / fov) * (width * 0.9);
        const screenY = height / 2 + (relPhi / fov) * (height * 0.9) + Math.sin(this.floatOffset) * 14;
        const scale = Math.max(0.4, 600 / this.distance);

        return { x: screenX, y: screenY, scale: scale };
      }

      draw() {
        const pos = this.getScreenPosition();
        if (!pos) return;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(pos.scale, pos.scale);
        ctx.globalAlpha = this.alpha;

        const pulse = Math.sin(this.floatOffset) * 5;

        if (this.type === 'slimer') {
          // Neon Yeşil Hayalet (Slimer Tarzı)
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#00f5d4';

          ctx.fillStyle = 'rgba(0, 245, 212, 0.4)';
          ctx.beginPath();
          ctx.arc(0, -10 + pulse, 38, Math.PI, 0, false);
          ctx.bezierCurveTo(42, 30, 25, 45, 0, 50 + pulse);
          ctx.bezierCurveTo(-25, 45, -42, 30, -38, -10 + pulse);
          ctx.fill();

          // Gözler
          ctx.fillStyle = '#fff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#fff';
          ctx.beginPath();
          ctx.arc(-14, -8 + pulse, 9, 0, Math.PI * 2);
          ctx.arc(14, -8 + pulse, 9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#06030b';
          ctx.beginPath();
          ctx.arc(-13, -8 + pulse, 4.5, 0, Math.PI * 2);
          ctx.arc(15, -8 + pulse, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // Sinsi Gülümseme
          ctx.strokeStyle = '#06030b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 14 + pulse, 14, 0.2, Math.PI - 0.2);
          ctx.stroke();

        } else if (this.type === 'dementor') {
          // Ruh Emici / Karanlık Hayalet
          ctx.shadowBlur = 45;
          ctx.shadowColor = '#b5179e';

          ctx.fillStyle = 'rgba(114, 9, 183, 0.55)';
          ctx.beginPath();
          ctx.arc(0, -15 + pulse, 42, Math.PI, 0, false);
          ctx.lineTo(38, 55 + pulse);
          ctx.lineTo(15, 40 + pulse);
          ctx.lineTo(0, 60 + pulse);
          ctx.lineTo(-18, 40 + pulse);
          ctx.lineTo(-38, 55 + pulse);
          ctx.closePath();
          ctx.fill();

          // Parlayan Kırmızı Gözler
          ctx.fillStyle = '#ff0055';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ff0055';
          ctx.beginPath();
          ctx.arc(-14, -12 + pulse, 6, 0, Math.PI * 2);
          ctx.arc(14, -12 + pulse, 6, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // Balkabağı Başlı Cadı Hayaleti 🎃
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#ff7b00';

          ctx.fillStyle = 'rgba(255, 123, 0, 0.85)';
          ctx.beginPath();
          ctx.ellipse(0, 0 + pulse, 36, 30, 0, 0, Math.PI * 2);
          ctx.fill();

          // Oyulmuş Ağız ve Gözler
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.moveTo(-16, -6 + pulse);
          ctx.lineTo(-8, -14 + pulse);
          ctx.lineTo(0, -6 + pulse);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, -6 + pulse);
          ctx.lineTo(8, -14 + pulse);
          ctx.lineTo(16, -6 + pulse);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 10 + pulse, 12, 0, Math.PI);
          ctx.fill();
        }

        // Can Barı
        if (this.health < this.maxHealth) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(-35, -55 + pulse, 70, 7);
          ctx.fillStyle = this.health > 40 ? '#00f5d4' : '#ff0055';
          ctx.fillRect(-35, -55 + pulse, (this.health / this.maxHealth) * 70, 7);
        }

        ctx.restore();
      }
    }

    // Hayaletleri Başlat (Salonda 4 adet)
    const ghosts = [new Ghost(), new Ghost(), new Ghost(), new Ghost()];

    // --- BÜYÜ IŞINI & PARÇACIKLAR ---
    const spellBeams = [];
    const particles = [];

    class SpellBeam {
      constructor(targetX, targetY, spellKey) {
        this.startX = width * 0.85;  // Asanın sağ alttaki ucu
        this.startY = height + 10;
        this.targetX = targetX;
        this.targetY = targetY;
        this.currentX = this.startX;
        this.currentY = this.startY;
        this.spell = SPELLS[spellKey];
        this.progress = 0;
        this.isDone = false;
      }

      update() {
        this.progress += 0.08;
        this.currentX = this.startX + (this.targetX - this.startX) * this.progress;
        this.currentY = this.startY + (this.targetY - this.startY) * this.progress;

        // Işın boyu kıvılcım parçacıkları saç
        for (let i = 0; i < 3; i++) {
          particles.push(new Particle(
            this.currentX + (Math.random() - 0.5) * 15,
            this.currentY + (Math.random() - 0.5) * 15,
            this.spell.color
          ));
        }

        if (this.progress >= 1) {
          this.isDone = true;
          this.onHit();
        }
      }

      onHit() {
        // Hedefte büyük sihirli patlama oluştur
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(this.targetX, this.targetY, this.spell.color, true));
        }

        // Hayalet vuruldu mu kontrol et
        ghosts.forEach(ghost => {
          const pos = ghost.getScreenPosition();
          if (!pos || ghost.isDying) return;

          const dist = Math.hypot(this.targetX - pos.x, this.targetY - pos.y);
          if (dist < 75 * pos.scale) {
            ghost.health -= this.spell.damage;
            if (navigator.vibrate) navigator.vibrate(40);

            if (ghost.health <= 0) {
              ghost.isDying = true;
              playGhostDeathSound();
              score += 150;
              scoreText.textContent = score;
            } else {
              score += 25;
              scoreText.textContent = score;
            }
          }
        });
      }

      draw() {
        ctx.save();
        ctx.strokeStyle = this.spell.color;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.spell.color;

        // Zikzaklı / Yıldırım Büyü Hattı
        ctx.beginPath();
        ctx.moveTo(this.startX, this.startY);
        const steps = 6;
        for (let i = 1; i <= steps; i++) {
          const t = (i / steps) * this.progress;
          const x = this.startX + (this.targetX - this.startX) * t + (Math.random() - 0.5) * 12;
          const y = this.startY + (this.targetY - this.startY) * t + (Math.random() - 0.5) * 12;
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Çekirdek Beyaz Işık
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color, isExplosion = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        const speed = isExplosion ? 3 + Math.random() * 6 : 1 + Math.random() * 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.size = 3 + Math.random() * 3.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.035;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- IŞIKLI KEDİ AYAK İZLERİ (LIGHT FOOTPRINTS) ---
    class LightFootprint {
      constructor(x, y, angle = 0) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.alpha = 0.95;
        this.scale = 1;
      }
      update() {
        this.alpha -= 0.012; // ~4 saniye boyunca yerde kalsın
        this.scale += 0.003;
      }
      draw(targetCtx) {
        if (this.alpha <= 0) return;
        targetCtx.save();
        targetCtx.globalAlpha = Math.max(0, this.alpha);
        targetCtx.translate(this.x, this.y);
        targetCtx.rotate(this.angle);
        targetCtx.scale(this.scale, this.scale);

        targetCtx.fillStyle = "#ffffff";
        targetCtx.shadowBlur = 14;
        targetCtx.shadowColor = "#ffffff";

        // Ana pati yastığı
        targetCtx.beginPath();
        targetCtx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // 4 adet sevimli parmak izi
        const toes = [
          { x: -7, y: -7, r: 2.5 },
          { x: -2.5, y: -9.5, r: 2.8 },
          { x: 2.5, y: -9.5, r: 2.8 },
          { x: 7, y: -7, r: 2.5 }
        ];
        toes.forEach(t => {
          targetCtx.beginPath();
          targetCtx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
          targetCtx.fill();
        });
        targetCtx.restore();
      }
    }

    // --- GERÇEK 3D BRITISH SHORTHAIR PATRONUS (LORD BOBAN / OZZY) ---
    const lightTrails = [];
    let activeCat = null;
    const catBadge = document.getElementById("catBadge");
    const catTimer = document.getElementById("catTimer");

    class BritishShorthairPatronus {
      constructor() {
        this.duration = 10000; // 10 saniye kutsal koruma
        this.startTime = Date.now();
        this.isAlive = true;
        this.walkCycle = 0;
        this.blinkTimer = 0;
        this.isBlinking = false;
        this.time = 0;

        // Ekranın Her Yerinde Özgürce Gezinme (Full-Screen Autonomous Roaming)
        this.x = width * 0.5;
        this.y = height * 0.52;
        this.speed = 2.4;
        this.facing = 1;       // 1: sağa bakar, -1: sola bakar (Asla 0 olmaz, incelip ezilmez!)
        this.tilt = 0;         // Dönüşlerde hafif aerodinamik yatış
        this.stepCounter = 0;
        this.pickNewDestination();

        // 4,400+ Ultra Yoğun Anatomik Işık Parçacığı (Videodaki Ozzy / Lord Boban)
        this.particles = this.generatePatronusParticles();

        catBadge.style.display = "flex";
        ghostCountText.innerHTML = "🛡️ SANCTUARY: Lord Boban Protected You!";
        ghostCountText.style.color = "#ffd166";

        // Salondaki tüm aktif hayaletleri anında yok et
        ghosts.forEach(g => {
          g.isDying = true;
          g.alpha = 0;
        });

        // Çağrılma anında ilahi gümüş-mavi yıldız parçacığı patlaması
        for (let i = 0; i < 40; i++) {
          particles.push(new Particle(this.x, this.y, "#ffffff", true));
        }
      }

      // Ekranın herhangi bir yerine yeni hedef belirle (Sadece ortada değil, tüm ekranda!)
      pickNewDestination() {
        const minX = 90;
        const maxX = Math.max(minX + 80, width - 90);
        const minY = 130;
        const maxY = Math.max(minY + 80, height - 170);

        let attempts = 0;
        let nx, ny, d;
        do {
          nx = minX + Math.random() * (maxX - minX);
          ny = minY + Math.random() * (maxY - minY);
          d = Math.hypot(nx - this.x, ny - this.y);
          attempts++;
        } while (d < Math.min(width * 0.35, 240) && attempts < 15);

        this.targetX = nx;
        this.targetY = ny;
      }

      update() {
        const elapsed = Date.now() - this.startTime;
        const remaining = Math.max(0, (this.duration - elapsed) / 1000);
        catTimer.textContent = remaining.toFixed(1);

        if (remaining <= 0) {
          this.isAlive = false;
          catBadge.style.display = "none";
          ghostCountText.textContent = "Active Specters: 3";
          ghostCountText.style.color = "#ff758f";

          // Kaybolurken parıldayan altın yıldız patlaması
          for (let i = 0; i < 45; i++) {
            particles.push(new Particle(this.x, this.y, "#ffd166", true));
          }
          return;
        }

        this.time += 0.055;
        this.stepCounter++;

        // Hedefe doğru akıcı yürüyüş
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 26) {
          this.pickNewDestination();
        } else {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
          this.walkCycle += 0.07;
        }

        // Yön Tayini: Asla yatayda ezilip sıfır genişliğe düşmez!
        if (dx > 8) {
          this.facing = 1;
        } else if (dx < -8) {
          this.facing = -1;
        }
        // Hafif gövde salınımı / yatışı
        this.tilt = (dx / (dist || 1)) * 0.08;

        // Gerçekçi Göz Kırpma
        this.blinkTimer++;
        if (this.blinkTimer > 130 && Math.random() < 0.06) {
          this.isBlinking = true;
          if (this.blinkTimer > 142) {
            this.isBlinking = false;
            this.blinkTimer = 0;
          }
        }

        // Kedi yürüdükçe arkasında parlayan ayak izleri bırakır
        if (this.stepCounter % 16 === 0) {
          const footOffset = (this.stepCounter % 32 === 0) ? -28 : 28;
          const footX = this.x + (footOffset * this.facing);
          const footY = this.y + 48;
          lightTrails.push(new LightFootprint(footX, footY, (dx >= 0 ? 0.2 : -0.2)));
          for (let p = 0; p < 2; p++) {
            particles.push(new Particle(footX, footY, "#ffffff"));
          }
        }

        // Yürürken havaya dökülen yıldız tozu izi
        if (Math.random() < 0.35) {
          particles.push(new Particle(
            this.x + (Math.random() - 0.5) * 60,
            this.y + (Math.random() - 0.5) * 45,
            Math.random() > 0.3 ? "#ffffff" : "#cccccc"
          ));
        }
      }

      // 8,800+ ULTRA YOĞUN YAPISAL PARÇACIK MODELİ (Kuyruk Yoğunluğu Tüm Bedene Uygulandı)
      generatePatronusParticles() {
        const pts = [];

        // 1. TÜM GÖVDE: Konsantrik Eliptik Dilimler ve Yüzey/Hacim Örgüsü (~3,200 parçacık)
        // Kuyruktaki yapısal ızgara yoğunluğunun aynısı gövdeye uygulandı!
        for (let s = -30; s <= 32; s += 1.8) {
          const yNorm = (s - 6) / 33;
          if (Math.abs(yNorm) >= 1) continue;
          const xRadius = 52 * Math.sqrt(1 - yNorm * yNorm);
          const yVal = s;
          const numPoints = Math.max(14, Math.floor(xRadius * 1.6));

          for (let shell = 0.5; shell <= 1.0; shell += 0.25) {
            for (let i = 0; i < numPoints; i++) {
              const a = (i / numPoints) * Math.PI * 2;
              const lx = Math.cos(a) * xRadius * shell;
              const ly = yVal + Math.sin(a) * 4 * (1 - shell);

              let col = "#606060"; // Boban Full Grey
              if (shell >= 0.98) col = "#e0e0e0"; // Gümüş-beyaz dış aura
              else if (ly < -8) col = "#909090"; // Sırt açık gri ışığı
              else if (ly > 22) col = "#383838"; // Göbek altı antrasit gölgesi
              else if (lx > 15) col = "#b0b0b0"; // Göğüs açık gri

              pts.push({ type: "body", lx, ly, size: 1.4, color: col, phase: Math.random() * 10 });
            }
          }
        }

        // 2. YUVARLAK KAFA: Konsantrik Küresel Katmanlar (~1,800 parçacık)
        const headCenterX = 34, headCenterY = -18, headR = 28;
        for (let r = 8; r <= headR; r += 3.5) {
          const isOuter = r >= headR - 1.2;
          const num = Math.floor(r * 4.0);
          for (let i = 0; i < num; i++) {
            const a = (i / num) * Math.PI * 2;
            const lx = headCenterX + Math.cos(a) * r;
            const ly = headCenterY + Math.sin(a) * r;

            let col = "#686868"; // Tam gri kafa
            if (isOuter) col = "#e8e8e8"; // Dış gümüş hat
            else if (ly < -30) col = "#9e9e9e"; // Alın açık gri
            else if (ly > -5) col = "#424242"; // Çene altı koyu gri

            pts.push({ type: "head", lx, ly, size: 1.4, color: col, phase: Math.random() * 10 });
          }
        }

        // 3. POFUDUK YANAKLAR: Yoğun Küresel Yanak Örgüsü (~800 parçacık)
        const cheeks = [{ cx: 48, cy: -10, rMax: 15 }, { cx: 22, cy: -10, rMax: 14 }];
        cheeks.forEach(chk => {
          for (let r = 3; r <= chk.rMax; r += 2.5) {
            const num = Math.floor(r * 4.4);
            for (let i = 0; i < num; i++) {
              const a = (i / num) * Math.PI * 2;
              pts.push({
                type: "cheek",
                lx: chk.cx + Math.cos(a) * r,
                ly: chk.cy + Math.sin(a) * r,
                size: 1.5,
                color: r > chk.rMax - 2 ? "#dcdcdc" : "#888888",
                phase: Math.random() * 10
              });
            }
          }
        });

        // 4. KULAKLAR: Yapısal Üçgen Örgü (~360 parçacık)
        for (let row = 0; row < 14; row++) {
          const t = row / 14;
          const w = (1 - t) * 14;
          for (let col = -w / 2; col <= w / 2; col += 2.2) {
            pts.push({ type: "ear", lx: 18 + col, ly: -34 - t * 20, size: 1.4, color: t < 0.7 ? "#9a8f92" : "#404040", phase: Math.random() * 10 });
            pts.push({ type: "ear", lx: 44 + col, ly: -34 - t * 20, size: 1.4, color: t < 0.7 ? "#9a8f92" : "#404040", phase: Math.random() * 10 });
          }
        }

        // 5. SEVİMLİ PEMBE BURUN & BIYIKLAR (~160 parçacık)
        for (let row = 0; row < 8; row++) {
          const t = row / 8;
          const w = (1 - t) * 6;
          for (let c = -w / 2; c <= w / 2; c += 1.8) {
            pts.push({ type: "nose", lx: 43 + c, ly: -13 + t * 4, size: 1.5, color: "#786870", phase: Math.random() * 10 });
          }
        }
        const whiskerOffsets = [
          { startX: 49, startY: -11, endX: 78, endY: -16 },
          { startX: 49, startY: -9, endX: 80, endY: -8 },
          { startX: 49, startY: -7, endX: 76, endY: 1 },
          { startX: 23, startY: -11, endX: -6, endY: -16 },
          { startX: 23, startY: -9, endX: -8, endY: -8 },
          { startX: 23, startY: -7, endX: -4, endY: 1 }
        ];
        whiskerOffsets.forEach(w => {
          for (let s = 0; s < 14; s++) {
            const f = s / 13;
            pts.push({ type: "whisker", lx: w.startX + (w.endX - w.startX) * f, ly: w.startY + (w.endY - w.startY) * f, size: 1.3, color: "#ffffff", phase: Math.random() * 10 });
          }
        });

        // 6. KEHRİBAR / ALTIN GÖZLER (~160 parçacık)
        const eyeCenters = [{ x: 27, y: -21 }, { x: 45, y: -21 }];
        eyeCenters.forEach(ec => {
          for (let r = 2; r <= 6.8; r += 2.0) {
            const num = Math.floor(r * 5.0);
            for (let i = 0; i < num; i++) {
              const a = (i / num) * Math.PI * 2;
              pts.push({ type: "eye", lx: ec.x + Math.cos(a) * r, ly: ec.y + Math.sin(a) * r, size: 1.8, color: r < 4.0 ? "#ffd166" : "#ffb703", phase: 0 });
            }
          }
          for (let i = -4; i <= 4; i++) {
            pts.push({ type: "pupil", lx: ec.x, ly: ec.y + i * 1.4, size: 1.8, color: "#050505", phase: 0 });
          }
          pts.push({ type: "glint", lx: ec.x - 2, ly: ec.y - 2, size: 2.2, color: "#ffffff", phase: 0 });
        });

        // 7. DÖRT BACAK VE PATİLER: Silindirik Bacak Boruları (~1,400 parçacık)
        const legs = [
          { id: "bl", hipX: -26, hipY: 18, isBack: true, phaseOffset: 0 },
          { id: "br", hipX: 20, hipY: 18, isBack: true, phaseOffset: Math.PI },
          { id: "fl", hipX: -16, hipY: 22, isBack: false, phaseOffset: Math.PI },
          { id: "fr", hipX: 32, hipY: 22, isBack: false, phaseOffset: 0 }
        ];
        legs.forEach(leg => {
          for (let slice = 0; slice < 20; slice++) {
            const seg = slice / 20;
            const legR = 6.2 * (1 - seg * 0.18); // Bileğe doğru hafif incelir
            for (let p = 0; p < 14; p++) {
              const a = (p / 14) * Math.PI * 2;
              pts.push({
                type: "leg",
                legId: leg.id,
                hipX: leg.hipX,
                hipY: leg.hipY,
                seg,
                colOffset: Math.cos(a) * legR,
                len: 26,
                phaseOffset: leg.phaseOffset,
                size: 1.4,
                color: leg.isBack ? "#484848" : "#666666",
                phase: Math.random() * 10
              });
            }
          }
          // Yuvarlak Pofuduk Patiler
          for (let p = 0; p < 36; p++) {
            const a = (p / 36) * Math.PI * 2;
            pts.push({
              type: "paw",
              legId: leg.id,
              hipX: leg.hipX,
              hipY: leg.hipY,
              phaseOffset: leg.phaseOffset,
              pawOffsetX: Math.cos(a) * 6.5,
              pawOffsetY: Math.sin(a) * 4.2,
              size: 1.8,
              color: "#e0e0e0",
              phase: Math.random() * 10
            });
          }
        });

        // 8. KUYRUK: TABANDAN UCA DOĞRU ZARİFÇE İNCELEN SİLİNDİR (Soba Borusu Değil! - 650 parçacık)
        const tailLength = 54;
        const rBase = 11.2; // Kalçada kalın, etli taban
        const rTip = 6.2;   // Uçta doğal incelen zarif kürk
        const numTailSlices = 38;
        const radialTailPts = 16;

        for (let s = 0; s < numTailSlices; s++) {
          const t = s / numTailSlices;
          const dist = t * tailLength;
          const curR = rBase * (1.0 - t * 0.45); // Uca doğru %45 incelir!

          for (let r = 0; r < radialTailPts; r++) {
            const angle = (r / radialTailPts) * Math.PI * 2;
            const normOffset = Math.cos(angle);
            let col = "#585858"; // Tam gri kuyruk
            if (normOffset < -0.6) col = "#909090"; // Üst açık gri ışık
            else if (normOffset > 0.6) col = "#383838"; // Alt koyu gölge
            else if (Math.abs(normOffset) > 0.85) col = "#e0e0e0"; // Gümüş rim ışığı

            pts.push({
              type: "tail_cyl",
              dist,
              rOffset: normOffset * curR,
              size: 1.5,
              color: col,
              phase: Math.random() * 10
            });
          }
        }

        // İncelen Silindirin Yuvarlak Kubbe Ucu (70 parçacık)
        for (let i = 0; i < 70; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * rTip;
          const capDist = tailLength + Math.sqrt(Math.max(0, rTip * rTip - r * r)) * 0.7;
          pts.push({
            type: "tail_cyl",
            dist: capDist,
            rOffset: Math.sin(a) * r,
            size: 1.5,
            color: "#707070",
            phase: Math.random() * 10
          });
        }

        // 9. KUTSAL LORD BOBAN ALTIN HALESİ (~160 parçacık)
        for (let i = 0; i < 90; i++) {
          const a = (i / 90) * Math.PI * 2;
          pts.push({ type: "halo", angle: a, rX: 26, rY: 8, size: 2.0, color: "#ffd166", phase: Math.random() * 10 });
        }
        for (let i = 0; i < 70; i++) {
          const a = (i / 70) * Math.PI * 2;
          pts.push({ type: "halo_inner", angle: a, rX: 21, rY: 6, size: 1.6, color: "#ffb703", phase: Math.random() * 10 });
        }

        return pts;
      }

      draw(targetCtx) {
        if (!this.isAlive) return;

        const bob = Math.sin(this.walkCycle * 4) * 6;
        const catX = this.x;
        const catY = this.y + bob;
        const scale = 2.2; // Görkemli, net ve iri boyut

        targetCtx.save();
        targetCtx.translate(catX, catY);
        targetCtx.rotate(this.tilt);
        targetCtx.scale(this.facing * scale, scale);

        // 1. Odayı Aydınlatan Gümüşi Beyaz Işık Halesi (Sıfır Mavi/Camgöbeği!)
        const auraGrad = targetCtx.createRadialGradient(0, 0, 15, 0, 0, 160);
        auraGrad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
        auraGrad.addColorStop(0.35, "rgba(230, 230, 230, 0.22)");
        auraGrad.addColorStop(0.7, "rgba(190, 190, 190, 0.08)");
        auraGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
        targetCtx.fillStyle = auraGrad;
        targetCtx.beginPath();
        targetCtx.arc(0, 0, 160, 0, Math.PI * 2);
        targetCtx.fill();

        // 2. KEDİNİN İÇİNİ DOLU GÖSTEREN ZEMİN SİLÜETİ (Hacimli kürk tabanı)
        targetCtx.save();
        targetCtx.fillStyle = "rgba(95, 95, 95, 0.82)"; // Full Grey Kürk Tabanı
        targetCtx.shadowBlur = 12;
        targetCtx.shadowColor = "#ffffff";

        // Gövde tabanı
        targetCtx.beginPath();
        targetCtx.ellipse(0, 7, 52, 34, 0, 0, Math.PI * 2);
        targetCtx.fill();

        // Kafa tabanı
        targetCtx.beginPath();
        targetCtx.arc(34, -18, 28, 0, Math.PI * 2);
        targetCtx.fill();

        // Tombul yanaklar
        targetCtx.beginPath();
        targetCtx.arc(48, -10, 15, 0, Math.PI * 2);
        targetCtx.arc(22, -10, 14, 0, Math.PI * 2);
        targetCtx.fill();

        // Kulak tabanları
        targetCtx.beginPath();
        targetCtx.moveTo(11, -26); targetCtx.lineTo(18, -54); targetCtx.lineTo(25, -26); targetCtx.closePath(); targetCtx.fill();
        targetCtx.beginPath();
        targetCtx.moveTo(37, -26); targetCtx.lineTo(44, -54); targetCtx.lineTo(51, -26); targetCtx.closePath(); targetCtx.fill();

        // DOĞAL İNCELEN SİLİNDİRİK KUYRUK TABANI (Soba Borusu Değil, Tabanda 11px -> Uçta 6.2px Zarif İncelme!)
        const tailBaseX = -45, tailBaseY = 6;
        const tailSway = Math.sin(this.walkCycle * 2.2) * 0.14;
        const tipTheta = (Math.PI * 0.86) + tailSway - 0.38;
        const tipX = tailBaseX + Math.cos(tipTheta) * 54;
        const tipY = tailBaseY - Math.sin(tipTheta) * 54;

        const baseNormAngle = (Math.PI * 0.86) + tailSway + Math.PI / 2;
        const tipNormAngle = tipTheta + Math.PI / 2;
        const nbX = Math.cos(baseNormAngle) * 11.2;
        const nbY = -Math.sin(baseNormAngle) * 11.2;
        const ntX = Math.cos(tipNormAngle) * 6.2;
        const ntY = -Math.sin(tipNormAngle) * 6.2;

        targetCtx.beginPath();
        targetCtx.moveTo(tailBaseX + nbX, tailBaseY + nbY);
        targetCtx.quadraticCurveTo(tailBaseX - 28 + nbX * 0.7, tailBaseY - 8 + tailSway * 18, tipX + ntX, tipY + ntY);
        targetCtx.arc(tipX, tipY, 6.2, -tipNormAngle, -tipNormAngle + Math.PI);
        targetCtx.quadraticCurveTo(tailBaseX - 28 - nbX * 0.7, tailBaseY - 8 + tailSway * 18, tailBaseX - nbX, tailBaseY - nbY);
        targetCtx.closePath();
        targetCtx.fill();
        targetCtx.restore();

        // 3. 8,800+ ULTRA YOĞUN IŞIK PARÇACIĞINI HESAPLA VE ÇİZ
        const haloOrbit = this.time * 1.8;

        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          let lx = 0, ly = 0;

          // Mikro titreşim (0.8px)
          const jitterX = Math.sin(this.time * 6 + p.phase) * 0.8;
          const jitterY = Math.cos(this.time * 5 + p.phase) * 0.8;

          if (p.type === "body" || p.type === "head" || p.type === "cheek" || p.type === "ear" || p.type === "nose" || p.type === "whisker") {
            lx = p.lx + jitterX;
            ly = p.ly + jitterY;
          } else if (p.type === "eye" || p.type === "pupil" || p.type === "glint") {
            if (this.isBlinking) continue;
            lx = p.lx + jitterX * 0.2;
            ly = p.ly + jitterY * 0.2;
          } else if (p.type === "leg") {
            const swing = Math.sin(this.walkCycle * 4 + p.phaseOffset) * 0.4;
            const currentLen = p.seg * p.len;
            lx = p.hipX + p.colOffset + Math.sin(swing) * currentLen + jitterX * 0.3;
            ly = p.hipY + Math.cos(swing) * currentLen + jitterY * 0.3;
          } else if (p.type === "paw") {
            const swing = Math.sin(this.walkCycle * 4 + p.phaseOffset) * 0.4;
            lx = p.hipX + p.pawOffsetX + Math.sin(swing) * 27 + jitterX * 0.3;
            ly = p.hipY + p.pawOffsetY + Math.cos(swing) * 27 + jitterY * 0.3;
          } else if (p.type === "tail_cyl") {
            const t = p.dist / 54;
            const theta = (Math.PI * 0.86) + tailSway - t * 0.38;
            const cx = tailBaseX + Math.cos(theta) * p.dist;
            const cy = tailBaseY - Math.sin(theta) * p.dist;
            lx = cx - Math.sin(theta) * p.rOffset + jitterX * 0.4;
            ly = cy - Math.cos(theta) * p.rOffset + jitterY * 0.4;
          } else if (p.type === "halo" || p.type === "halo_inner") {
            const a = p.angle + haloOrbit;
            lx = 34 + Math.cos(a) * p.rX + jitterX * 0.2;
            ly = -62 + Math.sin(a) * p.rY + jitterY * 0.2;
          }

          targetCtx.fillStyle = p.color;
          targetCtx.beginPath();
          targetCtx.arc(lx, ly, p.size, 0, Math.PI * 2);
          targetCtx.fill();
        }

        // 4. Kutsal Lord Boban Altın Başlığı 👑
        targetCtx.shadowBlur = 12;
        targetCtx.shadowColor = "#ffd166";
        targetCtx.fillStyle = "#ffd166";
        targetCtx.font = "bold 12px 'Outfit', sans-serif";
        targetCtx.textAlign = "center";
        targetCtx.fillText("👑 LORD BOBAN", 34, -76);

        targetCtx.restore();
      }
    }

    // --- BÜYÜ YAPMA (Ekrana Dokununca Ateşle) ---
    function castSpell(targetX, targetY) {
      initAudio();
      const spell = SPELLS[selectedSpell];

      // Ekran Flaşı
      flashOverlay.style.background = spell.flash;
      flashOverlay.style.opacity = "1";
      setTimeout(() => { flashOverlay.style.opacity = "0"; }, 100);

      playSpellSound(selectedSpell);
      if (navigator.vibrate) navigator.vibrate(35);

      spellBeams.push(new SpellBeam(targetX, targetY, selectedSpell));

      // EXPECTO PATRONUM atılırsa: Kedi Patronus u (Ozzy / Boban) çağır!
      if (selectedSpell === "patronum") {
        activeCat = new BritishShorthairPatronus();
      }
    }

    // Ekranın ortasına veya dokunulan noktaya büyü at
    canvas.addEventListener("click", (e) => {
      castSpell(e.clientX, e.clientY);
    });

    // Nişangah Takibi (Bir hayalete kilitlendiğinde kırmızıya dönsün)
    function checkCrosshairLock() {
      if (activeCat && activeCat.isAlive) {
        crosshair.classList.remove("locked");
        return;
      }

      let isLocked = false;
      ghosts.forEach(ghost => {
        const pos = ghost.getScreenPosition();
        if (!pos || ghost.isDying) return;
        const dist = Math.hypot(width / 2 - pos.x, height / 2 - pos.y);
        if (dist < 60 * pos.scale) isLocked = true;
      });

      if (isLocked) crosshair.classList.add("locked");
      else crosshair.classList.remove("locked");
    }

    // --- ANA OYUN DÖNGÜSÜ (Game Loop) ---
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // 1. Kedinin Bıraktığı Zemin Işık İzlerini Çiz ve Güncelle
      for (let i = lightTrails.length - 1; i >= 0; i--) {
        const trail = lightTrails[i];
        trail.update();
        trail.draw(ctx);
        if (trail.alpha <= 0) lightTrails.splice(i, 1);
      }

      // 2. Gerçek 3D Ruh Kedisi (Lord Boban - British Shorthair Patronus)
      if (activeCat) {
        activeCat.update();
        if (activeCat.isAlive) {
          activeCat.draw(ctx);
        } else {
          activeCat = null;
        }
      }

      // 3. Kutsal Koruma (Sanctuary): Kedi ekrandayken ASLA hayalet gelmez, var olanlar kaçar!
      if (activeCat && activeCat.isAlive) {
        ghosts.forEach(ghost => {
          ghost.alpha = Math.max(0, ghost.alpha - 0.08);
          if (ghost.alpha > 0) ghost.draw();
        });
      } else {
        // Kedi yokken normal hayaletler oyunda aktif olur
        ghosts.forEach(ghost => {
          ghost.update();
          ghost.draw();
        });
      }

      // Büyü Işınlarını Çiz
      for (let i = spellBeams.length - 1; i >= 0; i--) {
        const beam = spellBeams[i];
        beam.update();
        beam.draw();
        if (beam.isDone) spellBeams.splice(i, 1);
      }

      // Parçacıkları Çiz
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      checkCrosshairLock();
      requestAnimationFrame(gameLoop);
    }

    // Başlat Butonuna Basınca
    document.getElementById("startBtn").addEventListener("click", () => {
      initAudio();
      startCamera();
      document.getElementById("startModal").style.display = "none";
      gameLoop();
    });
  </script>
